<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>云界数商 · 站内转让</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #475569;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --brand: #00b86c;
      --brand-2: #00a05b;
      --brand-3: #008548;
      --brand-soft: #e6f9f0;
      --brand-border: #b3ebd0;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --rose-border: #fecdd3;
      --cyan: #0891b2;
      --cyan-soft: #ecfeff;
      --cyan-border: #a5f3fc;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;
      --line: #e2e8f0;
      --line-2: #f1f5f9;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px -18px rgba(15, 23, 42, .14);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, .08);
      --purple-border: #ddd6fe;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      font-size: 14px;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 84px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    input {
      font-family: inherit;
    }

    .icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .i11 { font-size: 11px; }
    .i12 { font-size: 12px; }
    .i14 { font-size: 14px; }
    .i16 { font-size: 16px; }
    .i18 { font-size: 18px; }
    .i20 { font-size: 20px; }
    .i22 { font-size: 22px; }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ================= 页头 ================= */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 16px 12px;
      background: var(--bg);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
    }

    .page-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    /* ================= GP 资产 ================= */
    .gp-hero {
      position: relative;
      overflow: hidden;
      margin: 12px 16px 14px;
      padding: 18px 18px 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, #00b86c 0%, #0891b2 100%);
      color: #fff;
      box-shadow: 0 12px 28px -14px rgba(0, 184, 108, .7);
      animation: rise .45s ease backwards;
    }

    .gp-hero::before {
      content: '';
      position: absolute;
      top: -46px;
      right: -34px;
      width: 138px;
      height: 138px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .13);
    }

    .gp-hero::after {
      content: '';
      position: absolute;
      bottom: -58px;
      right: 34px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
    }

    .gp-hero-top {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      opacity: .92;
    }

    .gp-hero-amount {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 8px;
      font-feature-settings: "tnum";
    }

    .gp-hero-amount b {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.6px;
      line-height: 1.05;
    }

    .gp-hero-amount span {
      font-size: 13px;
      font-weight: 600;
      opacity: .9;
    }

    .gp-hero-foot {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, .22);
      font-size: 11.5px;
    }

    .gp-hero-foot .cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .gp-hero-foot .cell i {
      font-style: normal;
      opacity: .82;
      font-size: 10.5px;
    }

    .gp-hero-foot .cell b {
      font-size: 13px;
      font-weight: 700;
      font-feature-settings: "tnum";
    }

    /* ================= 流程 ================= */
    .flow-card {
      margin: 0 16px 14px;
      padding: 15px 12px 13px;
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-xs);
      animation: rise .45s ease backwards;
      animation-delay: .03s;
    }

    .flow-row {
      display: flex;
      align-items: flex-start;
    }

    .flow-step {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      z-index: 1;
    }

    .flow-step::after {
      content: '';
      position: absolute;
      top: 13px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--line);
      z-index: -1;
    }

    .flow-step:last-child::after {
      display: none;
    }

    .flow-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      border: 2px solid #fff;
    }

    .flow-name {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-2);
      text-align: center;
      line-height: 1.3;
    }

    .flow-sub {
      font-size: 9.5px;
      color: var(--muted-2);
      text-align: center;
      line-height: 1.3;
      margin-top: -3px;
    }

    /* ================= 通用块 ================= */
    .block-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 0 16px 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .block-label .lb-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .block-label .lb-left .icon {
      color: var(--brand);
    }

    .block-label .lb-right {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .card {
      margin: 0 16px 16px;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-xs);
      animation: rise .45s ease backwards;
      animation-delay: .05s;
    }

    /* ================= 收款方 ================= */
    .recv-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .recv-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cyan-soft);
      color: var(--cyan);
    }

    .recv-input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      padding: 6px 0;
      font-feature-settings: "tnum";
    }

    .recv-input::placeholder {
      color: var(--muted-2);
      font-weight: 500;
      font-size: 14px;
    }

    .recv-result {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--green-soft);
      border: 1px solid var(--green-border);
    }

    .recv-result.show {
      display: flex;
    }

    .recv-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      border: 1px solid var(--green-border);
    }

    .recv-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .recv-sub {
      margin-top: 2px;
      font-size: 11px;
      color: var(--green);
      font-feature-settings: "tnum";
    }

    .tip-line {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line-2);
      font-size: 11px;
      line-height: 1.6;
      color: var(--muted);
    }

    .tip-line .icon {
      color: var(--muted-2);
      margin-top: 2px;
      flex-shrink: 0;
    }

    /* ================= 积分类型 ================= */
    .type-row {
      display: flex;
      gap: 8px;
    }

    .type-chip {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 6px;
      border-radius: 12px;
      border: 1.5px solid var(--brand);
      background: var(--brand-soft);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--brand-3);
    }

    .type-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ================= 数量 ================= */
    .amount-block {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .amount-input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -.5px;
      color: var(--ink);
      font-feature-settings: "tnum";
      padding: 0;
    }

    .amount-input::placeholder {
      color: var(--muted-2);
      font-weight: 600;
    }

    .token {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 6px 10px 6px 6px;
      border-radius: 11px;
      background: var(--line-2);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .token-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
      background: linear-gradient(135deg, #00b86c, #0891b2);
    }

    .quick-row {
      display: flex;
      gap: 7px;
      margin-top: 12px;
    }

    .quick {
      flex: 1;
      padding: 7px 0;
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-3);
      background: var(--line-2);
      border-radius: 9px;
      transition: all .18s;
    }

    .quick:active {
      background: var(--brand-soft);
      color: var(--brand);
    }

    /* ================= 到账预览 ================= */
    .arrive-card {
      margin: 0 16px 16px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--green-soft);
      border: 1px solid var(--green-border);
      animation: rise .45s ease backwards;
      animation-delay: .1s;
    }

    .arrive-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--green);
      font-weight: 600;
    }

    .arrive-val {
      margin-top: 6px;
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-feature-settings: "tnum";
    }

    .arrive-val b {
      font-size: 26px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -.5px;
    }

    .arrive-val span {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--green);
    }

    .arrive-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--green-border);
      font-size: 11px;
      color: var(--ink-3);
    }

    .arrive-meta .m {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .arrive-meta .m .icon {
      color: var(--green);
    }

    /* ================= 转让合并区 ================= */
    .tf-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tf-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-2);
    }

    .tf-hint {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-2);
      font-feature-settings: "tnum";
    }

    .tf-divider {
      height: 1px;
      background: var(--line-2);
      margin: 14px 0;
    }

    .tf-row .type-row {
      flex: 1;
    }

    .log-sym {
      font-size: 10.5px;
      font-weight: 700;
      opacity: .85;
      margin-left: 1px;
    }

    /* ================= 提交按钮 ================= */
    .primary-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: calc(100% - 32px);
      margin: 0 16px 6px;
      padding: 15px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 10px 22px -12px rgba(0, 184, 108, .9);
      transition: transform .15s;
    }

    .primary-btn:active {
      transform: scale(.985);
    }

    .foot-tip {
      margin: 8px 16px 18px;
      text-align: center;
      font-size: 11px;
      color: var(--muted-2);
      line-height: 1.6;
    }

    /* ================= 转让记录 ================= */
    .log-item {
      display: flex;
      align-items: center;
      gap: 11px;
      background: #fff;
      border: 1px solid var(--line-2);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-xs);
      transition: transform .15s, box-shadow .2s;
    }

    .log-item:active {
      transform: scale(.99);
      box-shadow: var(--shadow-sm);
    }

    .log-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 6px 14px -8px rgba(0, 0, 0, .45);
    }

    .log-body {
      flex: 1;
      min-width: 0;
    }

    .log-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .log-sub {
      margin-top: 3px;
      font-size: 10.5px;
      color: var(--muted-2);
      font-feature-settings: "tnum";
    }

    .log-amt {
      flex-shrink: 0;
      text-align: right;
      font-size: 13.5px;
      font-weight: 800;
      font-feature-settings: "tnum";
    }

    .log-amt.out {
      color: var(--rose);
    }

    .log-amt.in {
      color: var(--green);
    }

    .empty {
      padding: 30px 16px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.8;
      color: var(--muted-2);
      background: #fff;
      border-radius: 14px;
      border: 1px dashed var(--line);
    }

    /* ================= 规则 ================= */
    .rule-card {
      margin: 0 16px 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--blue-soft);
      border: 1px solid var(--blue-border);
      animation: rise .45s ease backwards;
      animation-delay: .14s;
    }

    .rule-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 7px;
    }

    .rule-body {
      font-size: 11.5px;
      line-height: 1.72;
      color: var(--ink-3);
    }

    .rule-body b {
      color: var(--ink);
    }

    /* ================= 弹窗 ================= */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-mask.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: 414px;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.2, .8, .3, 1);
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-mask.show .modal-sheet {
      transform: none;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .modal-close {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--line-2);
      color: var(--muted);
    }

    .confirm-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 16px;
      background: var(--bg);
      border: 1px solid var(--line);
    }

    .confirm-side {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .confirm-side .t-icon {
      margin: 0 auto 7px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      background: linear-gradient(135deg, #00b86c, #0891b2);
    }

    .confirm-side .amt {
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
      font-feature-settings: "tnum";
      letter-spacing: -.4px;
    }

    .confirm-side .sym {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    .confirm-arrow {
      flex-shrink: 0;
      color: var(--brand);
    }

    .detail-box {
      margin: 14px 0 0;
      padding: 2px 14px;
      background: var(--bg);
      border-radius: 14px;
      border: 1px solid var(--line);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      font-size: 12.5px;
      color: var(--muted);
      border-bottom: 1px dashed var(--line-2);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-row .v {
      font-weight: 700;
      color: var(--ink);
      font-feature-settings: "tnum";
      text-align: right;
    }

    .detail-row .v.brand {
      color: var(--brand);
    }

    .modal-sub {
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
      margin: 16px 0 8px;
    }

    .pwd-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .pwd-cell {
      flex: 1;
      height: 46px;
      border-radius: 11px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
      text-align: center;
      outline: none;
      width: 100%;
      min-width: 0;
      padding: 0;
    }

    .pwd-cell:focus {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 184, 108, .1);
    }

    .pwd-cell.filled {
      background: #fff;
      border-color: var(--brand-border);
    }

    .modal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }

    .modal-btn:active {
      transform: scale(.985);
    }

    /* ================= 底部导航 ================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      background: rgba(255, 255, 255, .97);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--line);
      display: flex;
      padding: 6px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      font-size: 11px;
      color: var(--muted);
      transition: color .2s;
    }

    .nav-item.active {
      color: var(--brand);
      font-weight: 700;
    }

    .nav-item .icon {
      font-size: 22px;
      stroke-width: 1.9;
      padding: 3px;
      border-radius: 50%;
      color: var(--muted);
      transition: background .22s, color .2s, transform .22s;
    }

    .nav-item.active .icon {
      color: var(--brand);
      background: rgba(0, 184, 108, .12);
      transform: translateY(-2px);
    }

    /* ================= Toast ================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translate(-50%, 14px);
      max-width: 300px;
      padding: 11px 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, .92);
      color: #fff;
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    /* ================= 收款方未找到 ================= */
    .recv-result.notfound {
      background: var(--rose-soft);
      border-color: var(--rose-border);
    }
    .recv-result.notfound .recv-sub {
      color: var(--rose);
    }

    /* ================= 积分类型 TAB ================= */
    .type-tabs {
      display: flex;
      gap: 6px;
      background: var(--line-2);
      padding: 4px;
      border-radius: 13px;
    }
    .type-tab {
      flex: 1;
      padding: 9px 4px;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-3);
      background: transparent;
      transition: all .18s;
      white-space: nowrap;
    }
    .type-tab.active {
      background: #fff;
      color: var(--brand-3);
      box-shadow: var(--shadow-xs);
    }

  </style>
</head>

  <script>
    /* ============================================================
       状态（与 SWAP 其他页共用）
       ============================================================ */
    const OTC_KEY = 'yjss_otc_state_v2';

    function seedState() {
      return {
        gpBalance: 128.00,
        frozenGp: 100.00,
        market: [],
        myOrders: [],
        deals: [],
        records: [],
        assets: { vc: 0, cnct: 8.60, redpacket: 10.00 }
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(OTC_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (s && typeof s.gpBalance === 'number') return s;
        }
      } catch (e) { /* 忽略 */ }
      const s = seedState();
      saveState(s);
      return s;
    }

    function saveState(s) {
      try { localStorage.setItem(OTC_KEY, JSON.stringify(s)); } catch (e) { /* 忽略 */ }
    }

    const ST = loadState();

    /* 可转让资产：文档 4.1 —— 仅 GP 绿色消费券支持站内转让；VC / 红包 仅用于消费抵扣，不参与转让 */
    const ASSETS = {
      GP: { sym: 'GP', label: '绿色消费券', bal: () => ST.gpBalance, grad: 'linear-gradient(135deg,#00b86c 0%,#0891b2 100%)' }
    };
    let curAsset = 'GP';

    function selectAsset(a) {
      curAsset = a;
      document.querySelectorAll('#typeTabs .type-tab').forEach(b => b.classList.toggle('active', b.dataset.asset === a));
      const cfg = ASSETS[a];
      document.querySelector('.gp-hero').style.background = cfg.grad;
      document.getElementById('heroLabel').textContent = '当前可用 ' + cfg.label;
      document.getElementById('heroUnit').textContent = cfg.sym;
      document.getElementById('gpBalance').textContent = fmt(cfg.bal());
      document.getElementById('balHint').textContent = '可用 ' + fmt(cfg.bal()) + ' ' + cfg.sym;
      document.getElementById('tokenIcon').textContent = cfg.sym;
      document.getElementById('tokenText').textContent = cfg.sym;
      document.getElementById('arriveUnit').textContent = cfg.sym;
      document.getElementById('cfPayIcon').textContent = cfg.sym;
      document.getElementById('cfGetIcon').textContent = cfg.sym;
      calc();
    }

    /* 转让记录（转出 / 转入） */
    ST.transfers = ST.transfers || [
      { id: 'TR20260912001', dir: 'out', party: 'UID 8826 5130', uid: '8826 5130', amount: 50, fee: 0, status: 'done', time: '2026-09-12 11:05', balance: 228.00 },
      { id: 'TR20260910007', dir: 'in', party: 'UID 8826 4471', uid: '8826 4471', amount: 30, fee: 0, status: 'done', time: '2026-09-10 09:22', balance: 198.00 },
      { id: 'TR20260908003', dir: 'out', party: 'UID 8826 6093', uid: '8826 6093', amount: 20, fee: 0, status: 'done', time: '2026-09-08 16:40', balance: 168.00 }
    ];

    const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const trimNum = n => (isFinite(n) ? String(parseFloat(Number(n).toFixed(6))) : '');

    /* ================= 收款方识别（UID 或钱包地址） ================= */
    const RECEIVERS = [
      { uid: '8826 5130', uidRaw: '88265130', wallet: '0x7c4f2A9b3d1e8F6052a4C7b9D0e1F2a3B4c5d6E7', name: 'UID 8826 5130', avatar: 'U', role: '创客' },
      { uid: '8826 4471', uidRaw: '88264471', wallet: '0x9a1B2c3D4e5F60718293A4b5C6d7E8f90A1b2C3d', name: 'UID 8826 4471', avatar: 'U', role: '消费商' },
      { uid: '8826 6093', uidRaw: '88266093', wallet: '0x2f3E4d5C6b7A80910A0b1C2d3E4f5A6b7C8d9e0', name: 'UID 8826 6093', avatar: 'U', role: '主播' },
      { uid: '8826 3388', uidRaw: '88263388', wallet: '0x5b6C7d8E9f0A1b2C3d4E5f6A7b8C9d0E1f2a3B4', name: 'UID 8826 3388', avatar: 'U', role: '服务商' }
    ];

    function shortWallet(w) {
      return w.slice(0, 6) + '...' + w.slice(-4);
    }

    function currentReceiver() {
      const raw = document.getElementById('recvInput').value.trim().replace(/ /g, '').toLowerCase();
      if (raw.length < 6) return { state: 'empty' };
      const r = RECEIVERS.find(x => x.uidRaw === raw || x.wallet.toLowerCase() === raw);
      if (r) return { state: 'ok', data: r };
      return { state: 'notfound' };
    }

    function onRecvInput() {
      const res = currentReceiver();
      const box = document.getElementById('recvResult');
      if (res.state === 'ok') {
        const r = res.data;
        document.getElementById('recvName').textContent = r.name;
        document.getElementById('recvAvatar').textContent = r.avatar;
        document.getElementById('recvSub').textContent = r.role + ' · ' + shortWallet(r.wallet);
        document.getElementById('recvChk').style.color = 'var(--green)';
        box.classList.remove('notfound');
        box.classList.add('show');
      } else if (res.state === 'notfound') {
        document.getElementById('recvName').textContent = '未找到该用户';
        document.getElementById('recvSub').textContent = '请确认 UID 或钱包地址是否正确';
        document.getElementById('recvChk').style.color = 'var(--rose)';
        box.classList.add('notfound');
        box.classList.add('show');
      } else {
        box.classList.remove('show', 'notfound');
      }
      calc();
    }

    /* ================= 渲染 ================= */
    function renderBalance() {
      document.getElementById('gpBalance').textContent = fmt(ST.gpBalance);
      document.getElementById('balHint').textContent = `可用 ${fmt(ST.gpBalance)} GP`;
    }

    function renderRecent() {
      const box = document.getElementById('recentList');
      const list = (ST.transfers || []).slice(0, 3);

      if (!list.length) {
        box.innerHTML = '<div class="empty">暂无转让记录</div>';
        return;
      }

      box.innerHTML = list.map(t => {
        const isOut = t.dir === 'out';
        return `
          <div class="log-item" onclick="location.href='转让详情.html'">
            <span class="log-icon" style="background:${isOut ? 'linear-gradient(135deg,#f43f5e,#e11d48)' : 'linear-gradient(135deg,#00b86c,#059669)'}">
              ${isOut ? '转出' : '转入'}
            </span>
            <div class="log-body">
              <div class="log-title">${isOut ? '转给 ' + t.party : '来自 ' + t.party}</div>
              <div class="log-sub">UID ${t.uid} · ${t.time}</div>
            </div>
            <div class="log-amt ${isOut ? 'out' : 'in'}">
              ${isOut ? '-' : '+'}${trimNum(t.amount)}<span class="log-sym">${t.asset || 'GP'}</span>
            </div>
          </div>`;
      }).join('');
    }

    /* ================= 数量 ================= */
    function calc() {
      const pay = parseFloat(document.getElementById('payInput').value) || 0;
      document.getElementById('arriveVal').textContent = fmt(pay);
    }

    function setRatio(ratio) {
      const bal = ASSETS[curAsset].bal();
      const v = ratio >= 1 ? bal : Math.floor(bal * ratio * 100) / 100;
      document.getElementById('payInput').value = trimNum(v);
      calc();
    }

    /* ================= 支付密码 ================= */
    function openPwd() {
      const res = currentReceiver();
      const pay = parseFloat(document.getElementById('payInput').value) || 0;
      const cfg = ASSETS[curAsset];

      if (res.state !== 'ok') return showToast('请输入正确的收款方 UID 或钱包地址');
      if (!(pay > 0)) return showToast('请输入转让数量');
      if (pay > cfg.bal()) return showToast(cfg.sym + ' 余额不足，当前可用 ' + fmt(cfg.bal()) + ' ' + cfg.sym);

      const r = res.data;
      document.getElementById('cfPay').textContent = trimNum(pay);
      document.getElementById('cfGet').textContent = trimNum(pay);
      document.getElementById('cfSym').textContent = r.name + ' 收到';
      document.getElementById('cfRecv').textContent = 'UID ' + r.uid;

      document.querySelectorAll('#pwdRow .pwd-cell').forEach(c => { c.value = ''; c.classList.remove('filled'); });
      document.getElementById('pwdModal').classList.add('show');
      setTimeout(() => document.querySelectorAll('#pwdRow .pwd-cell')[0].focus(), 320);
    }

    function closePwd() {
      document.getElementById('pwdModal').classList.remove('show');
    }

    function maskClose(e) {
      if (e.target.id === 'pwdModal') closePwd();
    }

    function onPwd(el, idx) {
      el.classList.toggle('filled', !!el.value);
      const cells = document.querySelectorAll('#pwdRow .pwd-cell');
      if (el.value && idx < cells.length - 1) cells[idx + 1].focus();
      if (!el.value && idx > 0) cells[idx - 1].focus();
    }

    /* ================= 提交转让 ================= */
    function confirmTransfer() {
      const code = [...document.querySelectorAll('#pwdRow .pwd-cell')].map(c => c.value).join('');
      if (code.length < 6) return showToast('请输入 6 位支付密码');

      const res = currentReceiver();
      const r = res.data;
      const pay = parseFloat(document.getElementById('payInput').value) || 0;

      if (res.state !== 'ok') { closePwd(); return showToast('请输入正确的收款方 UID 或钱包地址'); }
      if (!(pay > 0)) { closePwd(); return showToast('请输入转让数量'); }
      if (pay > ASSETS[curAsset].bal()) {
        closePwd();
        return showToast(ASSETS[curAsset].sym + ' 余额不足，当前可用 ' + fmt(ASSETS[curAsset].bal()) + ' ' + ASSETS[curAsset].sym);
      }

      /* 扣减转出方 GP 余额（站内转让仅支持 GP 绿色消费券） */
      ST.gpBalance = Math.round((ST.gpBalance - pay) * 100) / 100;

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const id = 'TR' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + String(Math.floor(Math.random() * 900) + 100);

      /* 写入转让记录 */
      ST.transfers = ST.transfers || [];
      ST.transfers.unshift({
        id: id,
        dir: 'out',
        asset: curAsset,
        party: r.name,
        uid: r.uid,
        amount: pay,
        fee: 0,
        status: 'done',
        time: timeStr,
        balance: ASSETS[curAsset].bal()
      });

      /* 写入账单 */
      ST.bills = ST.bills || [];
      ST.bills.unshift({
        asset: ASSETS[curAsset].sym,
        src: 'transfer',
        type: 'out',
        title: '站内转让',
        desc: `转给 UID ${r.uid} · ${ASSETS[curAsset].sym} · 0 手续费`,
        amount: -pay,
        time: timeStr,
        balance: ASSETS[curAsset].bal()
      });

      saveState(ST);

      /* 转让完成 → 跳转转让凭证页 */
      location.href = '转让详情.html';
    }

    /* ================= Toast ================= */
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ================= 初始化 ================= */
    renderBalance();
    renderRecent();
    onRecvInput();
  </script>
</body>

</html>
