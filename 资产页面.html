<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>云界数商 · SWAP 数字资产</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #475569;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --brand: #00b86c;
      --brand-2: #00a05b;
      --brand-3: #008548;
      --brand-soft: #e6f9f0;
      --brand-border: #b3ebd0;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --purple-border: #ddd6fe;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --rose-border: #fecdd3;
      --cyan: #0891b2;
      --cyan-soft: #ecfeff;
      --cyan-border: #a5f3fc;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;
      --line: #e2e8f0;
      --line-2: #f1f5f9;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px -18px rgba(15, 23, 42, .14);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, .08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      font-size: 14px;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 84px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    .icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .i11 { font-size: 11px; }
    .i12 { font-size: 12px; }
    .i14 { font-size: 14px; }
    .i16 { font-size: 16px; }
    .i18 { font-size: 18px; }
    .i20 { font-size: 20px; }
    .i22 { font-size: 22px; }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes pulseRing {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(0, 184, 108, .35);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(0, 184, 108, 0);
      }
    }

    /* ================= 页头 ================= */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 16px 12px;
      background: var(--bg);
    }

    /* ================= 品牌与多语言 ================= */
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--brand), var(--cyan));
      color: #fff;
      box-shadow: 0 6px 14px -8px rgba(0, 184, 108, .9);
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: .3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
      padding: 0 11px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
    }

    .lang-btn:active {
      background: var(--line-2);
    }

    .lang-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .lang-opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-radius: 13px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      transition: all .18s;
    }

    .lang-opt.active {
      background: var(--brand-soft);
      border-color: var(--brand-border);
      color: var(--brand);
    }

    .lang-opt .icon {
      color: var(--brand);
      opacity: 0;
      transition: opacity .18s;
    }

    .lang-opt.active .icon {
      opacity: 1;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
    }

    .page-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    /* ================= 钱包地址条（DApp 风，紧凑一行） ================= */
    .addr-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 16px 12px;
      padding: 10px 12px 10px 14px;
      border-radius: 14px;
      background: #fff;
      box-shadow: var(--shadow-xs);
      animation: rise .4s ease backwards;
    }

    .addr-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted-2);
    }

    .addr-dot.on {
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, .16);
    }

    .addr-text {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: .2px;
      font-feature-settings: "tnum";
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .addr-act {
      flex-shrink: 0;
      padding: 6px 13px;
      border-radius: 9px;
      background: var(--brand);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .addr-act:active {
      background: var(--brand-2);
    }

    .addr-icon {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--muted);
    }

    .addr-icon:active {
      background: var(--line-2);
    }

    /* 资产卡内的圆形快捷入口 */
    .hero-quick {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 4px;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid rgba(255, 255, 255, .22);
    }

    .hq {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .hq-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .2);
      border: 1px solid rgba(255, 255, 255, .28);
      color: #fff;
      transition: background .18s;
    }

    .hq:active .hq-icon {
      background: rgba(255, 255, 255, .38);
    }

    .hq-name {
      font-size: 10.5px;
      font-weight: 600;
      opacity: .94;
    }

    /* ================= 钱包卡（旧版，已弃用） ================= */
    .wallet-card {
      position: relative;
      overflow: hidden;
      margin: 0 16px 14px;
      padding: 18px;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #334155 100%);
      box-shadow: 0 14px 30px -18px rgba(15, 23, 42, .9);
      animation: rise .45s ease backwards;
    }

    .wallet-card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .06);
    }

    .wallet-card::after {
      content: '';
      position: absolute;
      bottom: -70px;
      left: -20px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .04);
    }

    .wallet-top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .wallet-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      opacity: .88;
    }

    .wallet-status {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .22);
      font-size: 10.5px;
      font-weight: 700;
    }

    .wallet-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted-2);
    }

    .wallet-status.on .dot {
      background: #34d399;
      animation: pulseRing 2s infinite;
    }

    .wallet-addr {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .wallet-addr .addr {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .4px;
      font-feature-settings: "tnum";
    }

    .copy-addr {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .24);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
    }

    .copy-addr:active {
      background: rgba(255, 255, 255, .3);
    }

    .wallet-desc {
      position: relative;
      margin-top: 10px;
      font-size: 11.5px;
      line-height: 1.7;
      opacity: .82;
    }

    .wallet-actions {
      position: relative;
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .wallet-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 13px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-size: 14.5px;
      font-weight: 700;
      box-shadow: 0 10px 22px -14px rgba(0, 184, 108, 1);
    }

    .wallet-btn.ghost {
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .24);
      box-shadow: none;
      font-size: 13px;
    }

    .wallet-btn:active {
      transform: scale(.98);
    }

    .wallet-meta {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, .18);
      font-size: 10.5px;
      opacity: .8;
    }

    /* ================= 资产总览 ================= */
    .block-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 0 16px 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .block-label .lb-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .block-label .lb-left .icon {
      color: var(--brand);
    }

    .block-label .lb-right {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .asset-hero {
      position: relative;
      margin: 0 16px 14px;
      padding: 18px 18px 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00b86c 0%, #0891b2 100%);
      color: #fff;
      overflow: hidden;
      box-shadow: 0 14px 30px -16px rgba(0, 184, 108, .9);
      animation: rise .45s ease backwards;
      animation-delay: .04s;
    }

    .asset-hero::before {
      content: '';
      position: absolute;
      top: -56px;
      right: -34px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .13);
    }

    .asset-hero::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: -36px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .09);
    }

    .asset-hero .k {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      opacity: .92;
    }

    .asset-hero .val {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 9px;
      font-feature-settings: "tnum";
    }

    .asset-hero .val b {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.6px;
    }

    .asset-hero .val span {
      font-size: 13px;
      font-weight: 600;
      opacity: .9;
    }

    .asset-hero .foot {
      position: absolute;
      top: 18px;
      right: 18px;
      display: flex;
    }

    .asset-hero .foot-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .18);
      font-size: 11px;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .asset-hero .foot-tag i {
      font-style: normal;
      opacity: .85;
    }

    /* ================= 资产列表 ================= */
    .asset-list {
      margin: 0 16px 16px;
      background: #fff;
      border-radius: 18px;
      box-shadow: var(--shadow-xs);
      overflow: hidden;
      animation: rise .45s ease backwards;
      animation-delay: .07s;
    }

    .asset-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line-2);
      transition: background .18s;
    }

    .asset-row:last-child {
      border-bottom: none;
    }

    .asset-row:active {
      background: var(--line-2);
    }

    .asset-row.locked {
      opacity: .62;
    }

    .a-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -.3px;
    }

    .a-body {
      flex: 1;
      min-width: 0;
    }

    .a-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .a-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 10.5px;
      color: var(--muted);
      font-feature-settings: "tnum";
    }

    .a-sub .tag {
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink-3);
      font-size: 9.5px;
      font-weight: 700;
    }

    .a-sub .tag.frozen {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .a-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .a-amount {
      text-align: right;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      font-feature-settings: "tnum";
      letter-spacing: -.3px;
    }

    .a-chev {
      color: var(--muted-2);
      font-size: 14px;
    }

    .ext-btn {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      padding: 4px 9px;
      border-radius: 9px;
      background: var(--purple-soft);
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
    }

    .ext-btn:active {
      background: var(--purple);
      color: #fff;
    }

    /* ================= 功能入口 ================= */
    .entry-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 0 16px 16px;
      animation: rise .45s ease backwards;
      animation-delay: .1s;
    }

    .entry {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 14px;
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-xs);
      transition: transform .15s;
    }

    .entry:active {
      transform: scale(.98);
    }

    .e-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .e-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .e-sub {
      margin-top: 3px;
      font-size: 10px;
      color: var(--muted);
    }

    .empty {
      padding: 34px 16px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.8;
      color: var(--muted-2);
      background: #fff;
      border-radius: 15px;
      border: 1px dashed var(--line);
    }

    /* ================= 弹窗 ================= */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-mask.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: 414px;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.2, .8, .3, 1);
      min-height: 340px;
      display: flex;
      flex-direction: column;
    }

    /* 确定按钮固定在 sheet 最底部，不随内容多少浮动 */
    .modal-sheet > .modal-btn:last-child,
    .modal-sheet > .modal-actions:last-child {
      margin-top: auto;
    }

    .modal-mask.show .modal-sheet {
      transform: none;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .modal-close {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--line-2);
      color: var(--muted);
    }

    .modal-sub {
      font-size: 11.5px;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .modal-sub b {
      color: var(--ink);
    }

    .wallet-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border-radius: 16px;
      border: 1.5px solid var(--brand);
      background: var(--brand-soft);
      margin-bottom: 14px;
    }

    .wallet-opt .w-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #334155);
      color: #fff;
    }

    .wallet-opt .w-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .wallet-opt .w-sub {
      margin-top: 3px;
      font-size: 10.5px;
      color: var(--brand-3);
      font-feature-settings: "tnum";
    }

    .auth-list {
      margin-bottom: 16px;
    }

    .auth-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--line-2);
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--ink-3);
    }

    .auth-row:last-child {
      border-bottom: none;
    }

    .auth-row .icon {
      color: var(--brand);
      margin-top: 2px;
      flex-shrink: 0;
    }

    .modal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;

        key: 'VC', icon: 'VC', bg: 'linear-gradient(135deg,#3b82f6,#06b6d4)',
        nameKey: 'aVC', subKey: 'subVC',
        get: () => ST.assets.vc || 0
      },
      {
        key: '红包', icon: '红包', bg: 'linear-gradient(135deg,#f43f5e,#e11d48)',
        nameKey: 'aRed', subKey: 'subRed',
        get: () => ST.assets.redpacket || 0
      },
      {
        key: 'CNCT', icon: 'CN', bg: 'linear-gradient(135deg,#8b5cf6,#d946ef)',
        nameKey: 'aCnct', subKey: 'subCnct',
        get: () => ST.assets.cnct || 0,
        ext: { href: '资产/CNCT跳转.html', labelKey: 'extAlipay' }
      }
    ];

    const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    /* ================= 渲染：钱包卡 ================= */
    function renderWallet() {
      const box = document.getElementById('walletCard');

      if (!wallet.connected) {
        box.innerHTML = `
          <div class="addr-bar" onclick="openConnect()">
            <span class="addr-dot"></span>
            <span class="addr-text">${t('notConnected')}</span>
            <span class="addr-act">${t('connect')}</span>
          </div>`;
        return;
      }

      box.innerHTML = `
        <div class="addr-bar">
          <span class="addr-dot on"></span>
          <span class="addr-text">${shortAddr(wallet.address)}</span>
          <button class="addr-icon" onclick="copyAddr()" title="复制地址">
            <svg class="icon i12"><use href="#i-copy" /></svg>
          </button>
          <button class="addr-icon" onclick="disconnectWallet()" title="断开连接">
            <svg class="icon i14"><use href="#i-x" /></svg>
          </button>
        </div>`;
    }

    /* ================= 渲染：资产列表 ================= */
    function renderAssets() {
      const box = document.getElementById('assetList');

      document.getElementById('gpTotal').textContent = wallet.connected ? fmt(ST.gpBalance) : '--';
      document.getElementById('gpFrozen').textContent = wallet.connected ? fmt(ST.frozenGp) + ' GP' : '--';

      box.innerHTML = ASSETS.map(a => {
        const amt = a.get();
        const frozen = a.frozen ? a.frozen() : 0;

        let subHTML = '';
        if (a.key === 'GP') {
          subHTML = `<span>${t('available')} ${fmt(amt - frozen)}</span>
                     ${frozen > 0 ? `<span class="tag frozen">${t('frozen')} ${fmt(frozen)}</span>` : ''}`;
        } else {
          subHTML = `<span>${t(a.subKey)}</span>`;
        }

        const href = wallet.connected
          ? '资产/资产账单.html?asset=' + encodeURIComponent(a.key)
          : '#';
        const clickAttr = wallet.connected
          ? ''
          : `onclick="event.preventDefault();showToast(t('connectFirst'))"`;
        const extHTML = a.ext
          ? `<span class="ext-btn" onclick="event.preventDefault();event.stopPropagation();location.href='${a.ext.href}'">
               <svg class="icon i11"><use href="#i-globe" /></svg>${t(a.ext.labelKey)}
             </span>`
          : '';

        return `
          <a class="asset-row ${wallet.connected ? '' : 'locked'}" href="${href}" ${clickAttr}>
            <span class="a-icon" style="background:${a.bg}">${a.icon}</span>
            <div class="a-body">
              <div class="a-name">${t(a.nameKey)}</div>
              <div class="a-sub">${subHTML}</div>
            </div>
            <div class="a-right">
              <span class="a-amount">
                ${wallet.connected ? fmt(amt) : '-- --'}
              </span>
              ${extHTML}
              <svg class="icon a-chev"><use href="#i-chev-r" /></svg>
            </div>
          </a>`;
      }).join('');
    }

    /* ================= 钱包操作 ================= */
    function openConnect() {
      document.getElementById('mockAddr').textContent = shortAddr(MOCK_ADDR);
      document.getElementById('connectModal').classList.add('show');
    }

    function closeConnect() {
      document.getElementById('connectModal').classList.remove('show');
    }

    function maskClose(e) {
      if (e.target.id === 'connectModal') closeConnect();
    }

    function confirmConnect() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      wallet = {
        connected: true,
        address: MOCK_ADDR,
        time: `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`
      };
      saveWallet(wallet);
      closeConnect();
      renderAll();
      showToast('钱包授权成功，已同步 6 类资产');
    }

    function disconnectWallet() {
      wallet = { connected: false, address: '', time: '' };
      saveWallet(wallet);
      renderAll();
      showToast('已断开钱包连接');
    }

    function copyAddr() {
      const text = wallet.address;
      const done = () => showToast('钱包地址已复制');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); cb(); } catch (e) { showToast('复制失败，请长按复制'); }
      document.body.removeChild(ta);
    }

    /* ================= Toast ================= */
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ================= 统一渲染 ================= */
    function renderAll() {
      renderWallet();
      renderAssets();
    }

    applyLang();
    renderAll();
  </script>
</body>

</html>
