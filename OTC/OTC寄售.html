<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>云界数商 · OTC 寄售</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #475569;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --brand: #00b86c;
      --brand-2: #00a05b;
      --brand-3: #008548;
      --brand-soft: #e6f9f0;
      --brand-border: #b3ebd0;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --purple-border: #ddd6fe;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --rose-border: #fecdd3;
      --cyan: #0891b2;
      --cyan-soft: #ecfeff;
      --cyan-border: #a5f3fc;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;
      --line: #e2e8f0;
      --line-2: #f1f5f9;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px -18px rgba(15, 23, 42, .14);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, .08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      font-size: 14px;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 84px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    input {
      font-family: inherit;
    }

    .icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .i11 { font-size: 11px; }
    .i12 { font-size: 12px; }
    .i14 { font-size: 14px; }
    .i16 { font-size: 16px; }
    .i18 { font-size: 18px; }
    .i20 { font-size: 20px; }
    .i22 { font-size: 22px; }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ================= 页头 ================= */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 16px 12px;
      background: var(--bg);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
    }

    .page-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    /* ================= GP 主余额 ================= */
    .gp-hero {
      position: relative;
      overflow: hidden;
      margin: 12px 16px 14px;
      padding: 18px 18px 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, #00b86c 0%, #0891b2 100%);
      color: #fff;
      box-shadow: 0 12px 28px -14px rgba(0, 184, 108, .7);
      animation: rise .45s ease backwards;
    }

    .gp-hero::before {
      content: '';
      position: absolute;
      top: -46px;
      right: -34px;
      width: 138px;
      height: 138px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .13);
    }

    .gp-hero::after {
      content: '';
      position: absolute;
      bottom: -58px;
      right: 34px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
    }

    .gp-hero-top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
      opacity: .92;
    }

    .gp-hero-top .left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gp-hero-amount {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 8px;
      font-feature-settings: "tnum";
    }

    .gp-hero-amount b {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.6px;
      line-height: 1.05;
    }

    .gp-hero-amount span {
      font-size: 13px;
      font-weight: 600;
      opacity: .9;
    }

    .gp-hero-foot {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, .22);
      font-size: 11.5px;
    }

    .gp-hero-foot .cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .gp-hero-foot .cell i {
      font-style: normal;
      opacity: .82;
      font-size: 10.5px;
    }

    .gp-hero-foot .cell b {
      font-size: 13px;
      font-weight: 700;
      font-feature-settings: "tnum";
    }

    /* ================= 通用块 ================= */
    .block-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 0 16px 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .block-label .lb-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .block-label .lb-left .icon {
      color: var(--brand);
    }

    .block-label .lb-right {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .card {
      margin: 0 16px 16px;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-xs);
      animation: rise .45s ease backwards;
      animation-delay: .05s;
    }

    /* ================= 交易流程说明 ================= */
    .flow-card {
      margin: 0 16px 16px;
      padding: 15px 12px 13px;
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-xs);
      animation: rise .45s ease backwards;
      animation-delay: .04s;
    }

    .flow-row {
      display: flex;
      align-items: flex-start;
    }

    .flow-step {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      z-index: 1;
    }

    .flow-step::after {
      content: '';
      position: absolute;
      top: 13px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--line);
      z-index: -1;
    }

    .flow-step:last-child::after {
      display: none;
    }

    .flow-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      border: 2px solid #fff;
    }

    .flow-name {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-2);
      text-align: center;
      line-height: 1.3;
    }

    .flow-sub {
      font-size: 9.5px;
      color: var(--muted-2);
      text-align: center;
      line-height: 1.3;
      margin-top: -3px;
    }

    /* ================= 进行中的交易 ================= */
    .deal-item {
      position: relative;
      background: #fff;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-xs);
      overflow: hidden;
      transition: transform .15s;
    }

    .deal-item:active {
      transform: scale(.99);
    }

    .deal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .deal-side {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .deal-side .tag {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
    }

    .deal-side.sell {
      color: var(--rose);
    }

    .deal-side.sell .tag {
      background: var(--rose);
    }

    .deal-side.buy {
      color: var(--brand);
    }

    .deal-side.buy .tag {
      background: var(--brand);
    }

    .oi-status {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .s-pending {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .s-part {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .s-done {
      background: var(--green-soft);
      color: var(--green);
    }

    .s-cancel {
      background: var(--line-2);
      color: var(--muted);
    }

    .s-idle {
      background: var(--line-2);
      color: var(--muted);
    }

    .deal-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 0;
      border-top: 1px dashed var(--line-2);
      border-bottom: 1px dashed var(--line-2);
    }

    .deal-meta .k {
      font-size: 10.5px;
      color: var(--muted);
    }

    .deal-meta .v {
      margin-top: 3px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      font-feature-settings: "tnum";
    }

    .deal-meta .v.amber {
      color: var(--amber);
    }

    .deal-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 11px;
      font-size: 10.5px;
      color: var(--muted-2);
      gap: 10px;
    }

    .deal-go {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--brand);
      flex-shrink: 0;
    }

    .deal-go.warn {
      color: var(--amber);
    }

    /* ================= 筛选 chips ================= */
    .chips {
      display: flex;
      gap: 7px;
      margin: 0 16px 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 6px 13px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      transition: all .2s;
    }

    .chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    /* ================= 列表 ================= */
    .list {
      margin: 0 16px 16px;
      animation: rise .45s ease backwards;
      animation-delay: .08s;
    }

    /* 挂单市场 */
    .mkt-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 15px;
      padding: 13px 14px;
      margin-bottom: 9px;
      box-shadow: var(--shadow-xs);
    }

    .mkt-badge {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      line-height: 1.1;
    }

    .mkt-badge b {
      font-size: 12px;
      font-weight: 800;
    }

    .mkt-badge span {
      font-size: 8.5px;
      opacity: .9;
    }

    .mkt-badge.sell {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
    }

    .mkt-badge.buy {
      background: linear-gradient(135deg, #00b86c, #059669);
    }

    .mkt-body {
      flex: 1;
      min-width: 0;
    }

    .mkt-top {
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .mkt-price {
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
      font-feature-settings: "tnum";
      letter-spacing: -.3px;
    }

    .mkt-unit {
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 600;
    }

    .mkt-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
      font-feature-settings: "tnum";
    }

    .mkt-sub .credit {
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--brand-soft);
      color: var(--brand-3);
      font-size: 9.5px;
      font-weight: 700;
    }

    .mkt-btn {
      flex-shrink: 0;
      padding: 9px 15px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
    }

    .mkt-btn.buy {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 6px 14px -8px rgba(0, 184, 108, .9);
    }

    .mkt-btn.sell {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      box-shadow: 0 6px 14px -8px rgba(225, 29, 72, .9);
    }

    /* 我的挂单 */
    .order-item {
      background: #fff;
      border-radius: 15px;
      padding: 13px 14px;
      margin-bottom: 9px;
      box-shadow: var(--shadow-xs);
    }

    .oi-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .oi-side {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .oi-side .tag {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
    }

    .oi-side.sell {
      color: var(--rose);
    }

    .oi-side.sell .tag {
      background: var(--rose);
    }

    .oi-side.buy {
      color: var(--brand);
    }

    .oi-side.buy .tag {
      background: var(--brand);
    }

    .oi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 0;
      border-top: 1px dashed var(--line-2);
      border-bottom: 1px dashed var(--line-2);
    }

    .oi-cell .k {
      font-size: 10.5px;
      color: var(--muted);
    }

    .oi-cell .v {
      margin-top: 3px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      font-feature-settings: "tnum";
    }

    .oi-cell .v.amber {
      color: var(--amber);
    }

    .oi-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted-2);
    }

    .oi-actions {
      display: flex;
      gap: 7px;
    }

    .mini-btn {
      padding: 5px 12px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--line-2);
      color: var(--ink-3);
    }

    .mini-btn.danger {
      background: var(--rose-soft);
      color: var(--rose);
    }

    /* 撮合记录 */
    .rec-item {
      display: flex;
      align-items: center;
      gap: 11px;
      background: #fff;
      border-radius: 15px;
      padding: 13px 14px;
      margin-bottom: 9px;
      box-shadow: var(--shadow-xs);
    }

    .rec-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
    }

    .rec-icon.sell {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
    }

    .rec-icon.buy {
      background: linear-gradient(135deg, #00b86c, #059669);
    }

    .rec-body {
      flex: 1;
      min-width: 0;
    }

    .rec-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .rec-sub {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    .rec-right {
      text-align: right;
      flex-shrink: 0;
    }

    .rec-amt {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
      font-feature-settings: "tnum";
    }

    .rec-fee {
      margin-top: 3px;
      font-size: 10.5px;
      color: var(--rose);
    }

    .empty {
      padding: 30px 16px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.75;
      color: var(--muted-2);
      background: #fff;
      border-radius: 15px;
      border: 1px dashed var(--line);
    }

    /* ================= 底部导航 ================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      background: rgba(255, 255, 255, .97);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--line);
      display: flex;
      padding: 6px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      font-size: 11px;
      color: var(--muted);
      transition: color .2s;
    }

    .nav-item.active {
      color: var(--brand);
      font-weight: 700;
    }

    .nav-item .icon {
      font-size: 22px;
      stroke-width: 1.9;
      padding: 3px;
      border-radius: 50%;
      color: var(--muted);
      transition: background .22s, color .2s, transform .22s;
    }

    .nav-item.active .icon {
      color: var(--brand);
      background: rgba(0, 184, 108, .12);
      transform: translateY(-2px);
    }

    /* ================= Toast ================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translate(-50%, 14px);
      max-width: 300px;
      padding: 11px 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, .92);
      color: #fff;
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ================= 发布挂单 ================= */
    .side-switch {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 13px;
      background: var(--bg);
      margin-bottom: 14px;
    }

    .side-btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
      transition: all .2s;
    }

    .side-btn.active {
      background: #fff;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    .side-btn.active[data-side="sell"] {
      color: var(--rose);
    }

    .side-btn.active[data-side="buy"] {
      color: var(--brand);
    }

    .form-item {
      padding: 12px 0;
      border-bottom: 1px dashed var(--line-2);
    }

    .form-item:last-of-type {
      border-bottom: none;
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .form-label .hint {
      color: var(--brand);
      font-weight: 600;
    }

    .form-inline {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.3px;
      color: var(--ink);
      font-feature-settings: "tnum";
      padding: 0;
    }

    .form-input::placeholder {
      color: var(--muted-2);
      font-weight: 600;
    }

    .unit {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 10px;

    function seedState() {
      return {
        gpBalance: 128.00,
        frozenGp: 100.00,
        market: [
          { id: 'M1001', side: 'sell', price: 1.00, qty: 500, party: 'UID 8826 4471', uid: '8826 4471', credit: '优秀', time: '2 分钟前' },
          { id: 'M1002', side: 'sell', price: 1.02, qty: 300, party: 'UID 8826 6093', uid: '8826 6093', credit: '良好', time: '6 分钟前' },
          { id: 'M1003', side: 'buy', price: 0.98, qty: 200, party: 'UID 8826 3388', uid: '8826 3388', credit: '优秀', time: '9 分钟前' },
          { id: 'M1004', side: 'buy', price: 0.96, qty: 800, party: 'UID 8826 2210', uid: '8826 2210', credit: '良好', time: '14 分钟前' }
        ],
        myOrders: [
          { id: 'G2005', side: 'sell', price: 1.10, qty: 60, filled: 0, status: 'pending', time: '09-13 11:20' },
          { id: 'G2001', side: 'sell', price: 1.00, qty: 100, filled: 0, status: 'pending', time: '09-13 10:12' },
          { id: 'G2002', side: 'sell', price: 1.05, qty: 200, filled: 120, status: 'part', time: '09-12 21:40' },
          { id: 'G2003', side: 'buy', price: 0.95, qty: 150, filled: 150, status: 'done', time: '09-11 15:08' },
          { id: 'G2004', side: 'sell', price: 1.20, qty: 80, filled: 0, status: 'cancel', time: '09-10 09:33' }
        ],
        /* 成交子单：fromOrder 指回产生它的挂单；无 fromOrder = 我在大厅吃下别人的挂单 */
        deals: [
          { id: 'OTC20260913005', role: 'buyer', price: 1.02, qty: 150, amount: 153, status: 'wait_pay', party: 'UID 8826 6093', uid: '8826 6093', time: '09-13 11:05' },
          { id: 'OTC20260913001', role: 'seller', price: 1.00, qty: 100, amount: 100, status: 'wait_pay', party: 'UID 8826 3388', uid: '8826 3388', time: '09-13 10:14', fromOrder: 'G2001' },
          { id: 'OTC20260912002', role: 'seller', price: 1.05, qty: 80, amount: 84, status: 'wait_release', party: 'UID 8826 4471', uid: '8826 4471', time: '09-12 21:42', paidTime: '09-12 21:58', payMethod: 'bank', fromOrder: 'G2002' },
          { id: 'OTC20260912001', role: 'seller', price: 1.05, qty: 40, amount: 42, status: 'done', party: 'UID 8826 6093', uid: '8826 6093', time: '09-12 21:41', paidTime: '09-12 21:48', releaseTime: '09-12 21:52', doneTime: '09-12 21:52', payMethod: 'balance', fromOrder: 'G2002' },
          { id: 'OTC20260911003', role: 'buyer', price: 0.95, qty: 150, amount: 142.5, status: 'done', party: 'UID 8826 2210', uid: '8826 2210', time: '09-11 15:08', paidTime: '09-11 15:20', releaseTime: '09-11 15:26', doneTime: '09-11 15:26', payMethod: 'bank', fromOrder: 'G2003' }
        ],
        records: [
          { side: 'sell', qty: 40, price: 1.05, fee: 4.20, time: '09-12 21:52', party: 'UID 8826 6093' },
          { side: 'buy', qty: 150, price: 0.95, fee: 0, time: '09-12 19:52', party: 'UID 8826 6093' },
          { side: 'sell', qty: 60, price: 1.02, fee: 6.12, time: '09-12 11:15', party: 'UID 8826 3388' },
          { side: 'sell', qty: 200, price: 1.00, fee: 20.00, time: '09-11 16:40', party: 'UID 8826 2210' }
        ]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(OTC_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (s && s.market && s.deals) return s;
        }
      } catch (e) { /* 忽略，使用种子数据 */ }
      const s = seedState();
      saveState(s);
      return s;
    }

    function saveState(s) {
      try { localStorage.setItem(OTC_KEY, JSON.stringify(s)); } catch (e) { /* 忽略 */ }
    }

    let ST = loadState();

    /* ================= 通用 ================= */
    const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const ORDER_STATUS = {
      pending: { text: '挂单中', cls: 's-pending' },
      part: { text: '部分成交', cls: 's-part' },
      done: { text: '已成交', cls: 's-done' },
      cancel: { text: '已撤单', cls: 's-cancel' }
    };

    const DEAL_STEPS = ['挂单/吃单', '买方支付', '卖方放行', '成交完成'];

    let currentSide = 'sell';

    /* ================= 余额渲染 ================= */
    function renderBalance() {
      document.getElementById('gpBalance').textContent = fmt(ST.gpBalance);
      document.getElementById('frozenGp').textContent = fmt(ST.frozenGp) + ' GP';
    }

    /* ================= 进行中的交易 ================= */
    function dealStepIndex(status) {
      if (status === 'wait_pay') return 1;
      if (status === 'wait_release') return 2;
      return 3;
    }

    function dealBadge(d) {
      if (d.status === 'wait_pay') {
        return d.role === 'buyer'
          ? { text: '待我支付', cls: 's-pending', mine: true }
          : { text: '待买方支付', cls: 's-part', mine: false };
      }
      if (d.status === 'wait_release') {
        return d.role === 'seller'
          ? { text: '待我放行', cls: 's-pending', mine: true }
          : { text: '待卖方放行', cls: 's-part', mine: false };
      }
      if (d.status === 'done') return { text: '已完成', cls: 's-done', mine: false };
      return { text: '已取消', cls: 's-cancel', mine: false };
    }

    function renderDeals() {
      const box = document.getElementById('dealList');
      const active = ST.deals.filter(d => d.status === 'wait_pay' || d.status === 'wait_release');
      const mineCount = active.filter(d => dealBadge(d).mine).length;
      document.getElementById('dealCount').innerHTML = active.length
        ? `${active.length} 笔进行中${mineCount ? ' · <span style="color:var(--amber)">' + mineCount + ' 笔待我处理</span>' : ''}`
        : '暂无进行中';

      if (!active.length) {
        box.innerHTML = '<div class="empty">暂无进行中的交易<br>可在下方「挂单市场」吃单，或发布自己的挂单</div>';
        return;
      }

      box.innerHTML = active.map(d => {
        const isSeller = d.role === 'seller';
        const amount = d.price * d.qty;
        const badge = dealBadge(d);
        const stepName = DEAL_STEPS[dealStepIndex(d.status)];
        return `
          <div class="deal-item" onclick="goDeal('${d.id}')">
            <div class="deal-head">
              <div class="deal-side ${isSeller ? 'sell' : 'buy'}">
                <span class="tag">${isSeller ? '卖' : '买'}</span>
                ${isSeller ? '我卖出 GP' : '我买入 GP'}
              </div>
              <span class="oi-status ${badge.cls}">${badge.text}</span>
            </div>
            <div class="deal-meta">
              <div>
                <div class="k">单价</div>
                <div class="v">$${fmt(d.price)}</div>
              </div>
              <div>
                <div class="k">数量</div>
                <div class="v">${d.qty} GP</div>
              </div>
              <div>
                <div class="k">${isSeller ? '预计到账' : '应付金额'}</div>
                <div class="v amber">$${fmt(isSeller ? amount * 0.9 : amount)}</div>
              </div>
            </div>
            <div class="deal-foot">
              <span>${d.fromOrder ? `挂单 ${d.fromOrder} · ` : ''}对手方 ${d.party} · ${d.time}</span>
              <span class="deal-go ${badge.mine ? 'warn' : ''}">
                ${badge.mine ? '去' + (d.status === 'wait_pay' ? '支付' : '放行') : stepName}
                <svg class="icon i11"><use href="#i-chev-r" /></svg>
              </span>
            </div>
          </div>`;
      }).join('');
    }

    function goDeal(id) {
      location.href = 'OTC-交易详情.html?id=' + encodeURIComponent(id);
    }

    /* ================= 快捷入口角标 ================= */
    function renderEntryStats() {
      /* 挂单被分笔吃单后产生的、待我处理的成交子单（不含我在大厅吃下的单） */
      const todo = ST.deals.filter(d => d.fromOrder && (
        (d.status === 'wait_pay' && d.role === 'buyer') ||
        (d.status === 'wait_release' && d.role === 'seller')
      )).length;

      const badge = document.getElementById('myOrderBadge');
      badge.textContent = todo > 99 ? '99+' : todo;
      badge.hidden = !todo;
    }

    /* ================= 发布挂单 ================= */
    document.querySelectorAll('#sideSwitch .side-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#sideSwitch .side-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSide = btn.dataset.side;
        applySide();
        calc();
      });
    });

    function applySide() {
      const isSell = currentSide === 'sell';
      const btn = document.getElementById('submitBtn');
      btn.className = 'primary-btn' + (isSell ? ' sell' : '');
      btn.innerHTML = '<svg class="icon i16"><use href="#i-lock" /></svg>发布';
      document.getElementById('modalBtn').className = 'modal-btn' + (isSell ? ' sell' : '');
      document.getElementById('feeRow').style.display = isSell ? 'flex' : 'none';
      document.getElementById('quickRow').style.display = isSell ? 'flex' : 'none';
      document.getElementById('balHint').textContent = isSell
        ? `可用 ${fmt(ST.gpBalance)} GP`
        : '买入挂单无需冻结 GP';
    }

    /* ---------- 实时预估 ---------- */
    function calc() {
      const price = parseFloat(document.getElementById('priceInput').value) || 0;
      const qty = parseFloat(document.getElementById('qtyInput').value) || 0;
      const total = price * qty;
      const isSell = currentSide === 'sell';
      const fee = isSell ? total * 0.1 : 0;

      document.getElementById('estTotal').textContent = '$ ' + fmt(total);
      document.getElementById('estFee').textContent = '- $ ' + fmt(fee);
      document.getElementById('estTotalLabel').textContent = isSell ? '预计到账' : '预计支付资金';
      document.getElementById('estArrive').textContent = '$ ' + fmt(isSell ? total - fee : total);

      const btn = document.getElementById('submitBtn');
      const invalid = !(price > 0) || !(qty > 0) || (isSell && qty > ST.gpBalance);
      btn.classList.toggle('disabled', invalid);

      updatePwdSub();
    }

    function setRatio(r) {
      if (currentSide !== 'sell') return;
      const v = r >= 1 ? ST.gpBalance : Math.floor(ST.gpBalance * r * 100) / 100;
      document.getElementById('qtyInput').value = Math.round(v);
      calc();
    }

    /* ---------- 支付密码 ---------- */
    function updatePwdSub() {
      const price = parseFloat(document.getElementById('priceInput').value) || 0;
      const qty = parseFloat(document.getElementById('qtyInput').value) || 0;
      const total = price * qty;
      const isSell = currentSide === 'sell';

      document.getElementById('modalBtnText').textContent = '确认发布';
      document.getElementById('pwdSub').innerHTML = isSell
        ? `冻结 <span class="rose">${fmt(qty)} GP</span> · 成交后到账 <span class="brand">$${fmt(total * 0.9)}</span>（已扣 10% 手续费）`
        : `<span class="brand">$${fmt(total)}</span> 买入 ${fmt(qty)} GP`;
    }

    function openPwd() {
      const price = parseFloat(document.getElementById('priceInput').value) || 0;
      const qty = parseFloat(document.getElementById('qtyInput').value) || 0;

      if (!(price > 0)) return showToast('请输入挂单单价');
      if (!(qty > 0)) return showToast('请输入挂单数量');
      if (currentSide === 'sell' && qty > ST.gpBalance) {
        return showToast('GP 余额不足，当前可用 ' + fmt(ST.gpBalance) + ' GP');
      }

      updatePwdSub();
      document.querySelectorAll('#pwdRow .pwd-cell').forEach(c => { c.value = ''; c.classList.remove('filled'); });
      document.getElementById('pwdModal').classList.add('show');
      setTimeout(() => document.querySelectorAll('#pwdRow .pwd-cell')[0].focus(), 320);
    }

    function closePwd() {
      document.getElementById('pwdModal').classList.remove('show');
    }

    function maskClose(e) {
      if (e.target.id === 'pwdModal') closePwd();
    }

    function onPwd(el, idx) {
      el.classList.toggle('filled', !!el.value);
      const cells = document.querySelectorAll('#pwdRow .pwd-cell');
      if (el.value && idx < cells.length - 1) cells[idx + 1].focus();
      if (!el.value && idx > 0) cells[idx - 1].focus();
    }

    /* ---------- 密码校验并发布挂单 ---------- */
    function confirmPwd() {
      const code = [...document.querySelectorAll('#pwdRow .pwd-cell')].map(c => c.value).join('');
      if (code.length < 6) return showToast('请输入 6 位支付密码');

      const price = parseFloat(document.getElementById('priceInput').value) || 0;
      const qty = parseFloat(document.getElementById('qtyInput').value) || 0;
      const isSell = currentSide === 'sell';

      if (isSell && qty > ST.gpBalance) {
        closePwd();
        return showToast('GP 余额不足，当前可用 ' + fmt(ST.gpBalance) + ' GP');
      }

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const orderId = 'G' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + String(Math.floor(Math.random() * 900) + 100);

      /* 1. 卖方冻结 GP */
      if (isSell) {
        ST.gpBalance = Math.round((ST.gpBalance - qty) * 100) / 100;
        ST.frozenGp = Math.round((ST.frozenGp + qty) * 100) / 100;
      }

      /* 2. 写入我的挂单 */
      ST.myOrders.unshift({
        id: orderId,
        side: currentSide,
        price: price,
        qty: qty,
        filled: 0,
        status: 'pending',
        time: timeStr
      });

      /* 3. 生成撮合订单（原型演示：挂单立即被对手方吃单） */
      const opposite = isSell
        ? { party: 'UID 8826 4471', uid: '8826 4471' }
        : { party: 'UID 8826 6093', uid: '8826 6093' };
      const dealId = 'OTC' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + String(Math.floor(Math.random() * 900) + 100);

      ST.deals.unshift({
        id: dealId,
        role: isSell ? 'seller' : 'buyer',
        price: price,
        qty: qty,
        amount: price * qty,
        status: 'wait_pay',
        party: opposite.party,
        uid: opposite.uid,
        time: timeStr,
        fromOrder: orderId
      });

      saveState(ST);
      closePwd();
      renderAll();
      showToast(isSell ? `挂单已发布，${qty} GP 已冻结` : `买单已发布：${qty} GP × $${fmt(price)}`);

      const el = document.getElementById('dealList');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    /* ================= 统一渲染 ================= */
    function renderAll() {
      renderBalance();
      renderDeals();
      renderEntryStats();
    }

    /* ================= Toast ================= */
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    /* ================= 初始化 ================= */
    renderAll();
    applySide();
    calc();
  </script>
</body>

</html>
