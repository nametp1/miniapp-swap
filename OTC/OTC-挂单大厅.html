<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>云界数商 · 挂单大厅</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #475569;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --brand: #00b86c;
      --brand-2: #00a05b;
      --brand-3: #008548;
      --brand-soft: #e6f9f0;
      --brand-border: #b3ebd0;
      --green: #059669;
      --green-soft: #ecfdf5;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --rose-border: #fecdd3;
      --cyan: #0891b2;
      --cyan-soft: #ecfeff;
      --cyan-border: #a5f3fc;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;
      --line: #e2e8f0;
      --line-2: #f1f5f9;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px -18px rgba(15, 23, 42, .14);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, .08);
      --green-border: #a7f3d0;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --purple-border: #ddd6fe;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      font-size: 14px;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 84px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    .icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .i11 { font-size: 11px; }
    .i12 { font-size: 12px; }
    .i14 { font-size: 14px; }
    .i16 { font-size: 16px; }
    .i18 { font-size: 18px; }
    .i20 { font-size: 20px; }
    .i22 { font-size: 22px; }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ================= 页头 ================= */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 16px 12px;
      background: var(--bg);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
    }

    .page-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    /* ================= 资产条 ================= */
    .gp-strip {
      display: flex;
      gap: 10px;
      margin: 0 16px 16px;
      animation: rise .45s ease backwards;
    }

    .gp-cell {
      flex: 1;
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: var(--shadow-xs);
    }

    .gp-cell .k {
      font-size: 10.5px;
      color: var(--muted);
    }

    .gp-cell .v {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
      font-feature-settings: "tnum";
      letter-spacing: -.4px;
    }

    .gp-cell .v.brand {
      color: var(--brand);
    }

    .gp-cell .v.muted {
      color: var(--muted);
    }

    /* ================= 流程说明 ================= */
    .flow-card {
      margin: 0 16px 16px;
      padding: 15px 12px 13px;
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-xs);
      animation: rise .45s ease backwards;
      animation-delay: .04s;
    }

    .flow-row {
      display: flex;
      align-items: flex-start;
    }

    .flow-step {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      z-index: 1;
    }

    .flow-step::after {
      content: '';
      position: absolute;
      top: 13px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--line);
      z-index: -1;
    }

    .flow-step:last-child::after {
      display: none;
    }

    .flow-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      border: 2px solid #fff;
    }

    .flow-name {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-2);
      text-align: center;
      line-height: 1.3;
    }

    .flow-sub {
      font-size: 9.5px;
      color: var(--muted-2);
      text-align: center;
      line-height: 1.3;
      margin-top: -3px;
    }

    /* ================= 通用块 ================= */
    .block-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 0 16px 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .block-label .lb-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .block-label .lb-left .icon {
      color: var(--brand);
    }

    .block-label .lb-right {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }


    /* ================= 买卖切换（币安式） ================= */
    .seg {
      display: flex;
      gap: 0;
      margin: 0 16px 12px;
      padding: 4px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow-xs);
    }

    .seg button {
      flex: 1;
      padding: 11px 0;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
      background: none;
      transition: all .2s;
    }

    .seg button.active.buy {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      box-shadow: 0 6px 14px -8px rgba(0, 184, 108, .9);
    }

    .seg button.active.sell {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #fff;
      box-shadow: 0 6px 14px -8px rgba(225, 29, 72, .9);
    }

    /* ================= 挂单列表 ================= */
    .list {
      margin: 0 16px 16px;
      animation: rise .45s ease backwards;
      animation-delay: .08s;
    }

    .mkt-item {
      display: flex;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--line-2);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-xs);
      transition: transform .15s, box-shadow .2s;
    }

    .mkt-item:active {
      transform: scale(.99);
      box-shadow: var(--shadow-sm);
    }

    .mkt-avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 6px 14px -8px rgba(0, 0, 0, .45);
    }

    .mkt-main {
      flex: 1;
      min-width: 0;
    }

    .mkt-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .mkt-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .mkt-credit {
      padding: 1px 7px;
      border-radius: 6px;
      background: var(--brand-soft);
      color: var(--brand-3);
      font-size: 9.5px;
      font-weight: 700;
    }

    .mkt-uid {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted-2);
      font-feature-settings: "tnum";
      letter-spacing: .2px;
    }

    .mkt-btn {
      flex-shrink: 0;
      align-self: center;
      padding: 9px 16px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
    }

    .mkt-btn.buy {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 6px 14px -8px rgba(0, 184, 108, .9);
    }

    .mkt-btn.sell {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      box-shadow: 0 6px 14px -8px rgba(225, 29, 72, .9);
    }

    .mkt-trade {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--line-2);
    }

    .mkt-price {
      font-size: 19px;
      font-weight: 800;
      color: var(--ink);
      font-feature-settings: "tnum";
      letter-spacing: -.3px;
    }

    .mkt-price span {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-left: 2px;
    }

    .mkt-avail {
      font-size: 11px;
      color: var(--muted);
      font-feature-settings: "tnum";
      text-align: right;
    }

    .mkt-pay {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .pay-tag {
      padding: 2px 8px;
      border-radius: 7px;
      background: var(--line-2);
      color: var(--ink-3);
      font-size: 10px;
      font-weight: 600;
    }

    .empty {
      padding: 40px 16px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.8;
      color: var(--muted-2);
      background: #fff;
      border-radius: 15px;
      border: 1px dashed var(--line);
    }

    /* ================= 底部导航 ================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      background: rgba(255, 255, 255, .97);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--line);
      display: flex;
      padding: 6px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      font-size: 11px;
      color: var(--muted);
      transition: color .2s;
    }

    .nav-item.active {
      color: var(--brand);
      font-weight: 700;
    }

    .nav-item .icon {
      font-size: 22px;
      stroke-width: 1.9;
      padding: 3px;
      border-radius: 50%;
      color: var(--muted);
      transition: background .22s, color .2s, transform .22s;
    }

    .nav-item.active .icon {
      color: var(--brand);
      background: rgba(0, 184, 108, .12);
      transform: translateY(-2px);
    }

    /* ================= Toast ================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translate(-50%, 14px);
      max-width: 300px;
      padding: 11px 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, .92);
      color: #fff;
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>

          { id: 'OTC20260912002', role: 'seller', price: 1.05, qty: 80, amount: 84, status: 'wait_release', party: 'UID 8826 4471', uid: '8826 4471', time: '09-12 21:42', paidTime: '09-12 21:58', payMethod: 'bank', fromOrder: 'G2002' },
          { id: 'OTC20260912001', role: 'seller', price: 1.05, qty: 40, amount: 42, status: 'done', party: 'UID 8826 6093', uid: '8826 6093', time: '09-12 21:41', paidTime: '09-12 21:48', releaseTime: '09-12 21:52', doneTime: '09-12 21:52', payMethod: 'balance', fromOrder: 'G2002' },
          { id: 'OTC20260911003', role: 'buyer', price: 0.95, qty: 150, amount: 142.5, status: 'done', party: 'UID 8826 2210', uid: '8826 2210', time: '09-11 15:08', paidTime: '09-11 15:20', releaseTime: '09-11 15:26', doneTime: '09-11 15:26', payMethod: 'bank', fromOrder: 'G2003' }
        ],
        records: [
          { side: 'sell', qty: 40, price: 1.05, fee: 4.20, time: '09-12 21:52', party: 'UID 8826 6093' },
          { side: 'buy', qty: 150, price: 0.95, fee: 0, time: '09-12 19:52', party: 'UID 8826 6093' },
          { side: 'sell', qty: 60, price: 1.02, fee: 6.12, time: '09-12 11:15', party: 'UID 8826 3388' },
          { side: 'sell', qty: 200, price: 1.00, fee: 20.00, time: '09-11 16:40', party: 'UID 8826 2210' }
        ]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(OTC_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (s && s.market && s.deals) return s;
        }
      } catch (e) { /* 忽略 */ }
      const s = seedState();
      saveState(s);
      return s;
    }

    function saveState(s) {
      try { localStorage.setItem(OTC_KEY, JSON.stringify(s)); } catch (e) { /* 忽略 */ }
    }

    const ST = loadState();

    const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const USD_RATE = 7.20;                       // 1 USD = 7.20 CNY（演示汇率）
    const toUsd = n => Number(n) / USD_RATE;     // GP 单价 → 美元

    /* UID 中间加密：保留前 4 后 2，中间以 **** 遮挡 */
    function maskUid(uid) {
      const d = String(uid).replace(/\D/g, '');
      if (d.length <= 6) return String(uid);
      return d.slice(0, 4) + ' **** ' + d.slice(-2);
    }

    let marketSide = 'sell';                      // 默认「买入 GP」：展示他人卖出挂单

    /* ================= 余额 ================= */
    function renderBalance() {
      document.getElementById('gpBalance').textContent = fmt(ST.gpBalance);
      document.getElementById('frozenGp').textContent = fmt(ST.frozenGp);
    }

    /* ================= 挂单市场 ================= */
    function renderMarket() {
      const box = document.getElementById('marketList');
      const arr = ST.market.filter(m => m.side === marketSide);

      if (!arr.length) {
        box.innerHTML = '<div class="empty">该方向暂无挂单<br><a href="OTC寄售.html#publish" style="color:var(--brand);font-weight:700;">去发布挂单</a></div>';
        return;
      }

      box.innerHTML = arr.map(m => {
        const isSell = m.side === 'sell';          // 对方卖出 → 我买入
        const myAction = isSell ? 'buy' : 'sell';
        const avatarBg = isSell
          ? 'linear-gradient(135deg,#00b86c,#059669)'
          : 'linear-gradient(135deg,#f43f5e,#e11d48)';
        const usd = toUsd(m.price);
        return `
          <div class="mkt-item">
            <div class="mkt-avatar" style="background:${avatarBg}">${m.uid.replace(/\D/g, '').charAt(0)}</div>
            <div class="mkt-main">
              <div class="mkt-head">
                <div>
                  <div class="mkt-name">UID ${maskUid(m.uid)}<span class="mkt-credit">${m.credit}</span></div>
                </div>
                <button class="mkt-btn ${myAction}" onclick="takeOrder('${m.id}')">
                  ${myAction === 'buy' ? '买入 GP' : '卖出 GP'}
                </button>
              </div>
              <div class="mkt-trade">
                <div class="mkt-price">$${usd.toFixed(4)}<span>/ GP</span></div>
                <div class="mkt-avail">该笔订单剩余 ${m.qty} GP</div>
              </div>
              <div class="mkt-pay">
                ${(m.pay || []).map(p => `<span class="pay-tag">${p}</span>`).join('')}
                <span class="pay-tag">平台担保</span>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    /* ---------- 吃单（整单撮合），成功后进入交易详情 ---------- */
    function takeOrder(mid) {
      const m = ST.market.find(x => x.id === mid);
      if (!m) return;

      const isSell = m.side === 'sell';            // 对方卖出 → 我买入
      const myRole = isSell ? 'buyer' : 'seller';
      const qty = m.qty;                           // 整单撮合
      const amount = m.price * qty;

      /* 我卖 GP 时校验并冻结余额 */
      if (myRole === 'seller') {
        if (qty > ST.gpBalance) {
          return showToast('GP 余额不足，需 ' + qty + ' GP，当前可用 ' + fmt(ST.gpBalance) + ' GP');
        }
        ST.gpBalance = Math.round((ST.gpBalance - qty) * 100) / 100;
        ST.frozenGp = Math.round((ST.frozenGp + qty) * 100) / 100;
      }

      /* 该挂单已被吃，从市场移除 */
      ST.market = ST.market.filter(x => x.id !== mid);

      /* 生成交易订单：进入「待买方支付」环节 */
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const dealId = 'OTC' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + String(Math.floor(Math.random() * 900) + 100);

      ST.deals.unshift({
        id: dealId,
        role: myRole,
        price: m.price,
        qty: qty,
        amount: amount,
        status: 'wait_pay',
        party: m.party,
        uid: m.uid,
        time: `${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`
      });

      saveState(ST);
      renderBalance();

      /* 吃单成功 → 进入交易详情继续支付 / 等待放行 */
      location.href = 'OTC-交易详情.html?id=' + encodeURIComponent(dealId);
    }

    /* ================= 买卖切换 ================= */
    document.querySelectorAll('#mktSeg button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#mktSeg button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        marketSide = b.dataset.side;
        renderMarket();
      });
    });

    /* ================= Toast ================= */
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ================= 初始化 ================= */
    renderBalance();
    renderMarket();
  </script>
</body>

</html>
