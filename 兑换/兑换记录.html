<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>云界数商 · 兑换记录</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #475569;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --brand: #00b86c;
      --brand-2: #00a05b;
      --brand-3: #008548;
      --brand-soft: #e6f9f0;
      --brand-border: #b3ebd0;
      --green: #059669;
      --green-soft: #ecfdf5;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --cyan: #0891b2;
      --cyan-soft: #ecfeff;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;
      --line: #e2e8f0;
      --line-2: #f1f5f9;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px -18px rgba(15, 23, 42, .14);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, .08);
      --green-border: #a7f3d0;
      --purple-border: #ddd6fe;
      --rose-border: #fecdd3;
      --cyan-border: #a5f3fc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      font-size: 14px;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 84px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    .icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .i11 { font-size: 11px; }
    .i12 { font-size: 12px; }
    .i14 { font-size: 14px; }
    .i16 { font-size: 16px; }
    .i18 { font-size: 18px; }
    .i20 { font-size: 20px; }
    .i22 { font-size: 22px; }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ================= 页头 ================= */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 16px 12px;
      background: var(--bg);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
    }

    .page-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    /* ================= 筛选 chips ================= */
    .chips {
      display: flex;
      gap: 7px;
      margin: 0 16px 14px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 6px 13px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      transition: all .2s;
    }

    .chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    /* ================= 汇总卡 ================= */
    .summary-card {
      position: relative;
      overflow: hidden;
      margin: 0 16px 16px;
      padding: 18px;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(135deg, #00b86c 0%, #0891b2 100%);
      box-shadow: 0 12px 28px -16px rgba(0, 184, 108, .85);
      animation: rise .45s ease backwards;
    }

    .summary-card::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .13);
    }

    .summary-card .k {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      opacity: .92;
    }

    .summary-card .val {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 8px;
      font-feature-settings: "tnum";
    }

    .summary-card .val b {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.6px;
    }

    .summary-card .val span {
      font-size: 12.5px;
      font-weight: 600;
      opacity: .9;
    }

    .summary-foot {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, .22);
      font-size: 11px;
      font-feature-settings: "tnum";
    }

    .summary-foot i {
      font-style: normal;
      opacity: .8;
      margin-right: 4px;
    }

    /* ================= 通用块 ================= */
    .block-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 0 16px 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .block-label .lb-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .block-label .lb-left .icon {
      color: var(--brand);
    }

    .block-label .lb-right {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    /* ================= 记录列表 ================= */
    .list {
      margin: 0 16px 16px;
      animation: rise .45s ease backwards;
      animation-delay: .05s;
    }

    .swap-item {
      background: #fff;
      border: 1px solid var(--line-2);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-xs);
      transition: transform .15s, box-shadow .2s;
    }

    .swap-item:active {
      transform: scale(.99);
      box-shadow: var(--shadow-sm);
    }

    .sw-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sw-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -.3px;
      box-shadow: 0 6px 14px -8px rgba(0, 0, 0, .45);
    }

    .sw-body {
      flex: 1;
      min-width: 0;
    }

    .sw-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .sw-flow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--muted);
      font-feature-settings: "tnum";
    }

    .sw-flow .arrow {
      color: var(--brand);
      font-weight: 700;
    }

    .sw-amt {
      flex-shrink: 0;
      text-align: right;
      font-size: 14px;
      font-weight: 800;
      color: var(--brand);
      font-feature-settings: "tnum";
      letter-spacing: -.2px;
    }

    .sw-amt i {
      display: block;
      font-style: normal;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted-2);
      margin-top: 3px;
    }

    .sw-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 10.5px;
      color: var(--muted-2);
      font-feature-settings: "tnum";
    }

    .sw-meta .tag {
      padding: 1px 7px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink-3);
      font-weight: 600;
    }

    .sw-meta .tag.warn {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .empty {
      padding: 40px 16px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.8;
      color: var(--muted-2);
      background: #fff;
      border-radius: 15px;
      border: 1px dashed var(--line);
    }

    /* ================= 底部导航 ================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      background: rgba(255, 255, 255, .97);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--line);
      display: flex;
      padding: 6px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      font-size: 11px;
      color: var(--muted);
      transition: color .2s;
    }

    .nav-item.active {
      color: var(--brand);
      font-weight: 700;
    }

    .nav-item .icon {
      font-size: 22px;
      stroke-width: 1.9;
      padding: 3px;
      border-radius: 50%;
      color: var(--muted);
      transition: background .22s, color .2s, transform .22s;
    }

    .nav-item.active .icon {
      color: var(--brand);
      background: rgba(0, 184, 108, .12);
      transform: translateY(-2px);
    }

    /* ================= Toast ================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translate(-50%, 14px);
      max-width: 300px;
      padding: 11px 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, .92);
      color: #fff;
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>

<body>

  <!-- ================= SVG 图标池 ================= -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">

      </symbol>
    </defs>
  </svg>

  <!-- ================= 页头 ================= -->
  <header class="page-header">
    <a class="icon-btn" href="资产兑换.html" title="返回资产兑换">
      <svg class="icon i16"><use href="#i-chev-l" /></svg>
    </a>
    <div class="page-title">兑换记录</div>
    <div class="icon-btn" style="visibility:hidden;"></div>
  </header>

  <!-- ================= 筛选 ================= -->
  <div class="chips" id="swapChips">
    <div class="chip active" data-sym="ALL">全部</div>
    <div class="chip" data-sym="VC">VC</div>
    <div class="chip" data-sym="CNCT">CNCT</div>
    <div class="chip" data-sym="GV">GV</div>
    <div class="chip" data-sym="红包">红包</div>
  </div>

  <!-- ================= 汇总 ================= -->
  <section class="summary-card" id="summary"></section>

  <!-- ================= 明细 ================= -->
  <div class="block-label">
    <div class="lb-left">
      <svg class="icon i14"><use href="#i-clock" /></svg>
      兑换明细
    </div>
    <div class="lb-right" id="swapCount"></div>
  </div>
  <div class="list" id="swapList"></div>

  <!-- ================= 底部导航 ================= -->
  <nav class="bottom-nav">
    <a class="nav-item" href="../index.html">
      <svg class="icon"><use href="#i-wallet" /></svg>
      <span>资产</span>
    </a>
    <a class="nav-item" href="../OTC/OTC寄售.html">
      <svg class="icon"><use href="#i-user" /></svg>
      <span>OTC</span>
    </a>
    <a class="nav-item" href="../../商城/首页-商城.html">
      <svg class="icon"><use href="#i-store" /></svg>
      <span>商城</span>
    </a>
    <a class="nav-item active" href="资产兑换.html">
      <svg class="icon"><use href="#i-arrows-ud" /></svg>
      <span>兑换</span>
    </a>
    <a class="nav-item" href="../转让/站内转让.html">
      <svg class="icon"><use href="#i-gift" /></svg>
      <span>转让</span>
    </a>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    /* ============================================================
       状态（与 SWAP 其他页共用）
       ============================================================ */
    const OTC_KEY = 'yjss_otc_state_v2';

    function seedState() {
      return {
        gpBalance: 128.00,
        frozenGp: 100.00,
        market: [],
        myOrders: [],
        deals: [],
        records: [],
        assets: { vc: 0, cnct: 8.60, redpacket: 10.00 },
        swaps: [
          { id: 'EX202609122108', toSym: 'CNCT', pay: 10, get: 9, rateText: '1 GP = 0.90 CNCT', feeText: '1.00 GP（10%）', time: '2026-09-12 21:08' },
          { id: 'EX202609091540', toSym: 'GV', pay: 10, get: 0.82, rateText: '1 GP = 0.0820 GV', feeText: '0.00（免手续费）', time: '2026-09-09 15:40' }
        ]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(OTC_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (s && typeof s.gpBalance === 'number') return s;
        }
      } catch (e) { /* 忽略 */ }
      const s = seedState();
      saveState(s);
      return s;
    }

    function saveState(s) {
      try { localStorage.setItem(OTC_KEY, JSON.stringify(s)); } catch (e) { /* 忽略 */ }
    }

    const ST = loadState();
    ST.swaps = ST.swaps || [
      { id: 'EX202609130101', fromSym: 'GP', toSym: 'VC', pay: 20, get: 20, rateText: '1 GP = 1.00 VC', feeText: '0.00（免手续费）', time: '2026-09-13 09:24' },
      { id: 'EX202609122108', fromSym: 'GP', toSym: 'CNCT', pay: 10, get: 9, rateText: '1 GP = 0.90 CNCT', feeText: '1.00 GP（10%）', time: '2026-09-12 21:08' },
      { id: 'EX202609091540', fromSym: 'GP', toSym: 'GV', pay: 10, get: 0.82, rateText: '1 GP = 0.0820 GV', feeText: '0.00（免手续费）', time: '2026-09-09 15:40' }
    ];

    /* ================= 资产字典 ================= */
    const TOKENS = {
      VC: { sym: 'VC', full: '代金券', iconText: 'VC', iconBg: 'linear-gradient(135deg,#3b82f6,#06b6d4)' },
      CNCT: { sym: 'CNCT', full: '数权宝积分', iconText: 'CN', iconBg: 'linear-gradient(135deg,#8b5cf6,#d946ef)' },
      GV: { sym: 'GV', full: '数字通证', iconText: 'GV', iconBg: 'linear-gradient(135deg,#f59e0b,#f97316)' },
      红包: { sym: '红包', full: '红包', iconText: '红包', iconBg: 'linear-gradient(135deg,#f43f5e,#e11d48)' }
    };

    const FROM_TOKENS = {
      GP: { sym: 'GP', full: 'GP 绿色消费券' },
      CP: { sym: 'CP', full: 'CP 共献积分' }
    };

    const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const trimNum = n => (isFinite(n) ? String(parseFloat(Number(n).toFixed(6))) : '');

    const QS = new URLSearchParams(location.search);
    let current = QS.get('sym') || 'ALL';

    /* ================= 筛选 ================= */
    function filterSwaps() {
      const all = ST.swaps || [];
      return current === 'ALL' ? all : all.filter(s => s.toSym === current);
    }

    /* ================= 渲染汇总 ================= */
    function renderSummary() {
      const list = filterSwaps();
      const payTotal = list.reduce((s, x) => s + (x.pay || 0), 0);
      const kinds = [...new Set(list.map(x => x.toSym))].length;

      const title = current === 'ALL' ? '累计兑换支出' : `${current} 累计兑换支出`;

      document.getElementById('summary').innerHTML = `
        <div class="k">
          <svg class="icon i14"><use href="#i-swap-v" /></svg>
          ${title}
        </div>
        <div class="val">
          <b>${fmt(payTotal)}</b>
          <span>GP</span>
        </div>
        <div class="summary-foot">
          <span><i>兑换笔数</i>${list.length} 笔</span>
        </div>`;
    }

    /* ================= 渲染列表 ================= */
    function renderList() {
      const box = document.getElementById('swapList');
      const list = filterSwaps();

      document.getElementById('swapCount').textContent = `共 ${list.length} 笔`;

      if (!list.length) {
        box.innerHTML = '<div class="empty">该资产暂无兑换记录<br><a href="资产兑换.html" style="color:var(--brand);font-weight:700;">去兑换</a></div>';
        return;
      }

      box.innerHTML = list.map(s => {
        const t = TOKENS[s.toSym] || { sym: s.toSym, full: '', iconText: '—', iconBg: 'linear-gradient(135deg,#94a3b8,#64748b)' };
        const f = FROM_TOKENS[s.fromSym] || FROM_TOKENS.GP;
        return `
          <div class="swap-item" onclick="location.href='兑换详情.html?id=${s.id}'">
            <div class="sw-head">
              <span class="sw-icon" style="background:${t.iconBg}">${t.iconText}</span>
              <div class="sw-body">
                <div class="sw-title">${f.sym} 兑换 ${t.sym}</div>
                <div class="sw-flow">
                  <span>${trimNum(s.pay)} ${f.sym}</span>
                  <span class="arrow">→</span>
                  <span>${trimNum(s.get)} ${t.sym}</span>
                </div>
              </div>
              <div class="sw-amt">
                +${trimNum(s.get)}
                <i>${t.sym}</i>
              </div>
            </div>
            <div class="sw-meta">
              <span class="tag">${s.rateText || ''}</span>
              <span class="tag warn">手续费 ${s.feeText || '0.00'}</span>
              <span>订单号 ${s.id}</span>
              <span>${s.time}</span>
            </div>
          </div>`;
      }).join('');
    }

    /* ================= 交互 ================= */
    document.querySelectorAll('#swapChips .chip').forEach(c => {
      c.addEventListener('click', () => {
        document.querySelectorAll('#swapChips .chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        current = c.dataset.sym;
        renderAll();
      });
    });

    function renderAll() {
      renderSummary();
      renderList();
    }

    /* ================= Toast ================= */
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ================= 初始化 ================= */
    document.querySelectorAll('#swapChips .chip').forEach(c => {
      c.classList.toggle('active', c.dataset.sym === current);
    });

    renderAll();
  </script>
</body>

</html>
