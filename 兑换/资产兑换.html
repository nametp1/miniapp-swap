<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>云界数商 · 资产兑换</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #475569;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --brand: #00b86c;
      --brand-2: #00a05b;
      --brand-3: #008548;
      --brand-soft: #e6f9f0;
      --brand-border: #b3ebd0;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --purple-border: #ddd6fe;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --rose-border: #fecdd3;
      --cyan: #0891b2;
      --cyan-soft: #ecfeff;
      --cyan-border: #a5f3fc;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;
      --line: #e2e8f0;
      --line-2: #f1f5f9;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px -18px rgba(15, 23, 42, .14);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, .08);
      --box: #f7f9fc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      font-size: 14px;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 84px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    input {
      font-family: inherit;
    }

    .icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .i11 { font-size: 11px; }
    .i12 { font-size: 12px; }
    .i14 { font-size: 14px; }
    .i16 { font-size: 16px; }
    .i18 { font-size: 18px; }
    .i20 { font-size: 20px; }
    .i22 { font-size: 22px; }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ================= 页头 ================= */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 16px 12px;
      background: var(--bg);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
    }

    .page-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    /* ================= SWAP 主卡 ================= */
    .swap-wrap {
      margin: 12px 14px 14px;
      animation: rise .45s ease backwards;
    }

    .swap-box {
      position: relative;
      background: var(--box);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px 16px 12px;
      transition: border-color .2s;
    }

    .swap-box:focus-within {
      border-color: var(--brand-border);
    }

    .swap-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .swap-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .swap-balance {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: var(--muted);
      font-feature-settings: "tnum";
      min-width: 0;
    }

    .swap-balance .num {
      color: var(--ink-2);
      font-weight: 700;
    }

    .max-btn {
      padding: 2px 8px;
      border-radius: 7px;
      background: var(--brand-soft);
      color: var(--brand-3);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .max-btn:active {
      background: var(--brand);
      color: #fff;
    }

    .swap-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }


    .t-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: -.2px;
      flex-shrink: 0;
    }


    /* 数量输入 */
    .amt-input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      text-align: right;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.6px;
      color: var(--ink);
      font-feature-settings: "tnum";
      padding: 4px 0;
    }

    .amt-input::placeholder {
      color: var(--muted-2);
      font-weight: 700;
    }

    /* 中间箭头 */
    .swap-arrow {
      position: relative;
      height: 12px;
      margin: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .swap-arrow .knob {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: #fff;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand);
      box-shadow: 0 4px 10px rgba(15, 23, 42, .09);
      transition: transform .2s;
    }

    .swap-arrow .knob:active {
      transform: scale(.9);
    }

    /* 汇率提示 */
    .rate-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 7px;
      font-size: 11.5px;
      color: var(--muted);
      font-feature-settings: "tnum";
    }

    .rate-line .val {
      color: var(--ink-2);
      font-weight: 700;
    }

    /* ================= 详情展开 ================= */
    .detail-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      margin: 10px 0 0;
      padding: 9px 0;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .detail-toggle .icon {
      transition: transform .25s;
      color: var(--muted);
    }

    .detail-toggle.open .icon {
      transform: rotate(180deg);
    }

    .detail-panel {
      display: none;
      margin-top: 8px;
      padding: 4px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .detail-panel.show {
      display: block;
      animation: rise .3s ease backwards;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      font-size: 12.5px;
      color: var(--muted);
      border-bottom: 1px dashed var(--line-2);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-row .v {
      font-weight: 700;
      color: var(--ink);
      font-feature-settings: "tnum";
      text-align: right;
    }

    .detail-row .v.rose {
      color: var(--rose);
    }

    .detail-row .v.brand {
      color: var(--brand);
    }

    /* ================= 兑换按钮 ================= */
    .swap-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      margin: 12px 0 0;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .3px;
      box-shadow: 0 12px 24px -14px rgba(0, 184, 108, 1);
      transition: transform .15s;
    }

    .swap-btn:active {
      transform: scale(.985);
    }

    .swap-btn.disabled {
      background: var(--muted-2);
      box-shadow: none;
    }

    /* ================= 通用块 ================= */
    .block-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 0 16px 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .block-label .lb-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .block-label .lb-left .icon {
      color: var(--brand);
    }

    .block-label .lb-right {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    /* ================= 规则卡 ================= */
    .rule-card {
      margin: 0 16px 14px;
      padding: 13px 14px;
      border-radius: 14px;
      background: var(--blue-soft);
      border: 1px solid var(--blue-border);
      animation: rise .45s ease backwards;
      animation-delay: .12s;
    }

    .rule-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 7px;
    }

    .rule-body {
      font-size: 11.5px;
      line-height: 1.75;
      color: var(--ink-3);
    }

    .rule-body b {
      color: var(--ink);
    }

    /* ================= 代币选择弹窗 ================= */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-mask.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: 414px;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.2, .8, .3, 1);
      max-height: 86vh;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-mask.show .modal-sheet {
      transform: none;
    }

    /* 内容过长时底部操作按钮常驻可见 */
    .modal-sheet > .modal-btn:last-child,
    .modal-sheet > .modal-actions:last-child {
      position: sticky;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 3;
      flex-shrink: 0;
      box-shadow: 0 calc(18px + env(safe-area-inset-bottom)) 0 0 #fff, 0 -12px 16px -10px rgba(15, 23, 42, .18);
      margin-top: auto;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
      padding: 0 2px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .modal-close {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--line-2);
      color: var(--muted);
    }

    .modal-sub {
      padding: 0 2px;
      margin-bottom: 12px;
      font-size: 11.5px;
      color: var(--muted);
    }

    /* ================= 代币下拉选择 ================= */
    .token-select-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      padding: 4px 11px 4px 4px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 2px 6px rgba(15, 23, 42, .05);
      transition: transform .18s, border-color .2s;
    }

    .token-select-wrap:active {
      transform: scale(.97);
    }

    .token-select {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: -.2px;
      color: var(--ink);
      cursor: pointer;
      max-width: 78px;
      padding: 0;
    }

    .token-select-wrap .chev {
      color: var(--muted-2);
      font-size: 12px;
      pointer-events: none;
      margin-left: -3px;
    }

    /* ================= 底部导航 ================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      background: rgba(255, 255, 255, .97);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--line);
      display: flex;
      padding: 6px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      font-size: 11px;
      color: var(--muted);
      transition: color .2s;
    }

    .nav-item.active {
      color: var(--brand);
      font-weight: 700;
    }

    .nav-item .icon {
      font-size: 22px;
      stroke-width: 1.9;
      padding: 3px;
      border-radius: 50%;
      color: var(--muted);
      transition: background .22s, color .2s, transform .22s;
    }

    .nav-item.active .icon {
      color: var(--brand);
      background: rgba(0, 184, 108, .12);
      transform: translateY(-2px);
    }

    /* ================= Toast ================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translate(-50%, 14px);
      max-width: 300px;
      padding: 11px 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, .92);
      color: #fff;
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ================= 兑换流程 ================= */
    .flow-card {
      margin: 0 16px 14px;
      padding: 15px 12px 13px;
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-xs);
      animation: rise .45s ease backwards;
      animation-delay: .03s;
    }

    .flow-row {
      display: flex;
      align-items: flex-start;
    }

    .flow-step {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      z-index: 1;
    }

    .flow-step::after {
      content: '';
      position: absolute;
      top: 13px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--line);
      z-index: -1;
    }

    .flow-step:last-child::after {
      display: none;
    }

    .flow-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      border: 2px solid #fff;
    }

    .flow-name {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-2);
      text-align: center;
      line-height: 1.3;
    }

    .flow-sub {
      font-size: 9.5px;
      color: var(--muted-2);
      text-align: center;
      line-height: 1.3;
      margin-top: -3px;
    }

    /* ================= 兑换记录 ================= */
    .swap-log {
      margin: 0 16px 16px;
      animation: rise .45s ease backwards;
      animation-delay: .1s;
    }

    .log-item {
      display: flex;
      align-items: center;
      gap: 11px;
      background: #fff;
      border-radius: 16px;
      padding: 13px 14px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-xs);
      transition: transform .15s, box-shadow .2s;
    }

    .log-item:active {
      transform: scale(.99);
      box-shadow: var(--shadow-sm);
    }

    .log-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 4px 10px -6px rgba(0, 0, 0, .35);
    }

    .log-body {
      flex: 1;
      min-width: 0;
    }

    .log-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .log-sub {
      margin-top: 3px;
      font-size: 10.5px;
      color: var(--muted-2);
      font-feature-settings: "tnum";
    }

    .log-right {
      flex-shrink: 0;
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      text-align: right;
    }

    .log-amt {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--brand);
      font-feature-settings: "tnum";
    }

    .log-time {
      font-size: 10.5px;
      color: var(--muted-2);
      font-feature-settings: "tnum";
    }

    .empty {
      padding: 30px 16px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.8;
      color: var(--muted-2);
      background: #fff;
      border-radius: 14px;
      border: 1px dashed var(--line);
    }

    /* ================= 确认兑换 ================= */
    .confirm-swap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 16px;
      background: var(--box);
      border: 1px solid var(--line);
      margin-bottom: 4px;
    }

    .confirm-side {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .confirm-side .t-icon {
      margin: 0 auto 7px;
      width: 34px;
      height: 34px;
      font-size: 11px;
    }

    .confirm-side .amt {
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
      font-feature-settings: "tnum";
      letter-spacing: -.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .confirm-side .sym {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    .confirm-arrow {
      flex-shrink: 0;
      color: var(--brand);
    }

    .pwd-row {
      display: flex;
      gap: 8px;
      margin: 16px 0 18px;
    }

    .pwd-cell {
      flex: 1;
      height: 46px;
      border-radius: 11px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
      text-align: center;
      outline: none;
      width: 100%;
      min-width: 0;
      padding: 0;
    }

    .pwd-cell:focus {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 184, 108, .1);
    }

    .pwd-cell.filled {
      background: #fff;
      border-color: var(--brand-border);
    }

    /* ================= 结果 ================= */
    @keyframes pop {
      0% {
        transform: scale(.6);
        opacity: 0;
      }

      60% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .result-icon {
      width: 60px;
      height: 60px;
      margin: 4px auto 14px;
      border-radius: 50%;
      background: var(--brand-soft);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop .45s ease backwards;
    }

    .result-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }

    .result-sub {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .result-card {
      margin: 16px 0;
      padding: 2px 14px;
      background: var(--box);
      border-radius: 14px;
      border: 1px solid var(--line);
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      font-size: 12.5px;
      color: var(--muted);
      border-bottom: 1px dashed var(--line-2);
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-row .v {
      font-weight: 700;
      color: var(--ink);

  <div class="toast" id="toast"></div>

  <script>
    /* ============================================================
       状态（与 OTC 各页共用 GP 余额）
       ============================================================ */
    const OTC_KEY = 'yjss_otc_state_v2';

    function seedState() {
      return {
        gpBalance: 128.00,
        frozenGp: 100.00,
        market: [],
        myOrders: [],
        deals: [],
        records: [],
        assets: { cp: 5000, vc: 0, cnct: 8.60, redpacket: 10.00 }
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(OTC_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (s && typeof s.gpBalance === 'number') return s;
        }
      } catch (e) { /* 忽略 */ }
      const s = seedState();
      saveState(s);
      return s;
    }

    function saveState(s) {
      try { localStorage.setItem(OTC_KEY, JSON.stringify(s)); } catch (e) { /* 忽略 */ }
    }

    const ST = loadState();
    ST.assets = ST.assets || { cp: 5000, vc: 0, cnct: 8.60, redpacket: 10.00 };
    if (typeof ST.assets.cp !== 'number') ST.assets.cp = 5000;
    if (typeof ST.assets.redpacket !== 'number') ST.assets.redpacket = 10.00;
    ST.swaps = ST.swaps || [
      { id: 'EX202609122108', toSym: 'CNCT', pay: 10, get: 9, rateText: '1 GP = 0.90 CNCT', feeText: '1.00 GP（10%）', time: '2026-09-12 21:08' },
      { id: 'EX202609091540', toSym: 'GV', pay: 10, get: 0.82, rateText: '1 GP = 0.0820 GV', feeText: '0.00（免手续费）', time: '2026-09-09 15:40' }
    ];

    const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const trimNum = n => (isFinite(n) ? String(parseFloat(n.toFixed(6))) : '');

    /* ================= 资产字典（文档 4.1 / 6.1） ================= */
    const TOKENS = {
      GP: {
        sym: 'GP',
        full: '绿色消费券',
        iconText: 'GP',
        iconBg: 'linear-gradient(135deg,#00b86c,#0891b2)'
      },
      CP: {
        sym: 'CP',
        full: '共献积分',
        iconText: 'CP',
        iconBg: 'linear-gradient(135deg,#00b86c,#059669)'
      },
      VC: {
        sym: 'VC',
        full: '代金券',
        iconText: 'VC',
        iconBg: 'linear-gradient(135deg,#3b82f6,#06b6d4)',
        rate: 1,
        feeRate: 0,
        rateText: '1 GP = 1.00 VC',
        arrive: '即时到账',
        route: '站内等额兑换（1:1）',
        rule: '<b>GP 兑换 VC 代金券</b>：1 GP = 1 VC，等额 1:1 转换，实时入账；<br>VC 可在商城自营商品或本地线下合作商家消费时 1:1 抵扣。'
      },
      CNCT: {
        sym: 'CNCT',
        full: '数权宝积分',
        iconText: 'CN',
        iconBg: 'linear-gradient(135deg,#8b5cf6,#d946ef)',
        rate: 0.9,
        feeRate: 0.1,
        rateText: '1 GP = 0.90 CNCT',
        arrive: '跨生态接口到账',
        route: '跨生态接口对接',
        rule: '<b>GP 兑换 CNCT 数权宝积分</b>：1 GP = 0.9 CNCT，扣除 10% 平台服务费；<br>经跨生态接口对接，用于外部生态应用场景消费。'
      },
      GV: {
        sym: 'GV',
        full: '数字通证',
        iconText: 'GV',
        iconBg: 'linear-gradient(135deg,#f59e0b,#f97316)',
        rate: 0.082,
        feeRate: 0,
        rateText: '1 GP = 0.0820 GV',
        arrive: '按实时汇率折算',
        route: '外部 Oracle 汇率机',
        external: true,
        rule: '<b>GP 兑换 GV 数字通证</b>：按外部市场实时动态汇率折算；<br>调取外部 Oracle 汇率机结算，跨生态流通，<b>不进入系统账户余额表</b>。'
      },
      红包: {
        sym: '红包',
        full: '红包',
        iconText: '红包',
        iconBg: 'linear-gradient(135deg,#f43f5e,#e11d48)',
        rate: 0.01,
        feeRate: 0,
        rateText: '100 CP = 1.00 红包',
        arrive: '即时到账',
        rule: '<b>CP 兑换红包</b>：100 CP = 1 红包，免手续费，即时到账；<br>红包可在商城指定红包专区商品抵扣使用。'
      }
    };

    let toSym = 'VC';
    let fromSym = 'GP';

    /* 支付方可选资产；收到方可选资产按支付方约束 */
    const FROM_TOKENS = ['GP', 'CP'];
    const GET_TOKENS = { GP: ['VC', 'CNCT', 'GV'], CP: ['红包'] };

    /* ================= 余额 ================= */
    function balanceOf(sym) {
      if (sym === 'GP') return ST.gpBalance;
      if (sym === 'CP') return ST.assets.cp || 0;
      if (sym === 'VC') return ST.assets.vc || 0;
      if (sym === '红包') return ST.assets.redpacket || 0;
      if (sym === 'CNCT') return ST.assets.cnct || 0;
      return null; // GV 不入账户
    }

    /* ================= 渲染 ================= */
    function render() {
      const t = TOKENS[toSym];
      const f = TOKENS[fromSym];

      document.getElementById('fromIcon').textContent = f.iconText;
      document.getElementById('fromIcon').style.background = f.iconBg;
      document.getElementById('fromSelect').value = fromSym;

      document.getElementById('payBal').textContent = fmt(balanceOf(fromSym));

      /* 收到侧代币 */
      document.getElementById('getIcon').textContent = t.iconText;
      document.getElementById('getIcon').style.background = t.iconBg;
      document.getElementById('getSelect').value = toSym;

      const bal = balanceOf(toSym);
      document.getElementById('getBalWrap').innerHTML = t.external
        ? '<span style="color:var(--muted-2)">外部通道，不入账户</span>'
        : `余额 <span class="num">${fmt(bal)}</span>`;

      /* 汇率与详情 */
      document.getElementById('rateMini').textContent = t.rateText;
      document.getElementById('dRate').textContent = t.rateText;
      document.getElementById('dArrive').textContent = t.arrive;

      const pay = parseFloat(document.getElementById('payInput').value) || 0;
      const fee = pay * t.feeRate;
      const feeEl = document.getElementById('dFee');
      feeEl.textContent = t.feeRate > 0
        ? `${fmt(fee)} ${fromSym}（${Math.round(t.feeRate * 100)}%）`
        : '0.00（免手续费）';
      feeEl.className = 'v' + (t.feeRate > 0 ? ' rose' : '');

      updateBtn();
    }

    /* ================= 按钮状态 ================= */
    function updateBtn() {
      const btn = document.getElementById('swapBtn');
      const pay = parseFloat(document.getElementById('payInput').value) || 0;
      const t = TOKENS[toSym];

      let text, disabled;
      const bal = balanceOf(fromSym);
      if (!(pay > 0)) {
        text = '输入兑换数量';
        disabled = true;
      } else if (pay > bal) {
        text = fromSym + ' 余额不足';
        disabled = true;
      } else {
        const get = pay * t.rate;
        text = `兑换为 ${trimNum(get)} ${toSym}`;
        disabled = false;
      }

      btn.innerHTML = text;
      btn.classList.toggle('disabled', disabled);
    }

    /* ================= 计算（双向输入） ================= */
    function calcFromPay() {
      const pay = parseFloat(document.getElementById('payInput').value) || 0;
      const t = TOKENS[toSym];
      document.getElementById('getInput').value = pay > 0 ? trimNum(pay * t.rate) : '';
      render();
    }

    function calcFromGet() {
      const get = parseFloat(document.getElementById('getInput').value) || 0;
      const t = TOKENS[toSym];
      document.getElementById('payInput').value = get > 0 ? trimNum(get / t.rate) : '';
      render();
    }

    /* ================= MAX ================= */
    function setMax() {
      document.getElementById('payInput').value = trimNum(balanceOf(fromSym));
      calcFromPay();
    }

    /* ================= 方向 / 代币 ================= */
    function swapDirection() {
      showToast('平台仅支持 ' + fromSym + ' 兑换为其他资产，暂不支持反向兑换');
    }

    /* ================= 代币下拉选择 ================= */
    function renderGetOptions() {
      const sel = document.getElementById('getSelect');
      const allowed = GET_TOKENS[fromSym];
      sel.innerHTML = allowed.map(sym =>
        `<option value="${sym}">${TOKENS[sym].sym}</option>`
      ).join('');
      sel.value = toSym;
    }

    function onFromChange() {
      fromSym = document.getElementById('fromSelect').value;
      const allowed = GET_TOKENS[fromSym];
      if (!allowed.includes(toSym)) toSym = allowed[0];

      renderGetOptions();
      document.getElementById('payInput').value = '';
      document.getElementById('getInput').value = '';
      render();
      showToast(fromSym === 'CP'
        ? '已切换为 CP 支付 · 共献积分仅可兑换红包'
        : '已切换为 GP 支付');
    }

    function onGetChange() {
      toSym = document.getElementById('getSelect').value;
      calcFromPay();
      render();
    }

    function maskClose(e) {
      if (e.target.id === 'confirmModal') closeConfirm();
      if (e.target.id === 'resultModal') closeResult();
    }

    /* ================= 详情展开 ================= */
    function toggleDetail() {
      const panel = document.getElementById('detailPanel');
      const toggle = document.getElementById('detailToggle');
      const open = panel.classList.toggle('show');
      toggle.classList.toggle('open', open);
    }

    /* ================= 第一步：打开确认（金额 + 明细 + 支付密码） ================= */
    function doSwap() {
      const pay = parseFloat(document.getElementById('payInput').value) || 0;
      const t = TOKENS[toSym];

      if (!(pay > 0)) return showToast('请输入兑换数量');
      const bal = balanceOf(fromSym);
      if (pay > bal) {
        return showToast(fromSym + ' 余额不足，当前可用 ' + fmt(bal) + ' ' + fromSym);
      }

      const get = pay * t.rate;
      const fee = pay * t.feeRate;

      document.getElementById('cfPay').textContent = trimNum(pay);
      document.getElementById('cfGet').textContent = trimNum(get);
      document.getElementById('cfIcon').textContent = t.iconText;
      document.getElementById('cfIcon').style.background = t.iconBg;
      document.getElementById('cfSym').textContent = '收到 ' + t.sym;
      document.getElementById('cfRate').textContent = t.rateText;
      document.getElementById('cfFee').textContent = t.feeRate > 0
        ? `${trimNum(fee)} ${fromSym}（${Math.round(t.feeRate * 100)}%）`
        : '0.00（免手续费）';
      document.getElementById('cfFee').className = 'v' + (t.feeRate > 0 ? ' rose' : '');
      document.getElementById('cfArrive').textContent = `${trimNum(get)} ${t.sym}`;
      document.getElementById('cfTime').textContent = t.arrive;

      document.querySelectorAll('#pwdRow .pwd-cell').forEach(c => { c.value = ''; c.classList.remove('filled'); });
      document.getElementById('confirmModal').classList.add('show');
      setTimeout(() => document.querySelectorAll('#pwdRow .pwd-cell')[0].focus(), 320);
    }

    function closeConfirm() {
      document.getElementById('confirmModal').classList.remove('show');
    }

    function onPwd(el, idx) {
      el.classList.toggle('filled', !!el.value);
      const cells = document.querySelectorAll('#pwdRow .pwd-cell');
      if (el.value && idx < cells.length - 1) cells[idx + 1].focus();
      if (!el.value && idx > 0) cells[idx - 1].focus();
    }

    /* ================= 第二步：密码校验并执行兑换 ================= */
    function confirmSwap() {
      const code = [...document.querySelectorAll('#pwdRow .pwd-cell')].map(c => c.value).join('');
      if (code.length < 6) return showToast('请输入 6 位支付密码');

      const pay = parseFloat(document.getElementById('payInput').value) || 0;
      const t = TOKENS[toSym];

      if (!(pay > 0)) { closeConfirm(); return showToast('请输入兑换数量'); }
      const bal = balanceOf(fromSym);
      if (pay > bal) {
        closeConfirm();
        return showToast(fromSym + ' 余额不足，当前可用 ' + fmt(bal) + ' ' + fromSym);
      }

      const get = pay * t.rate;

      /* 扣减支付方 */
      if (fromSym === 'GP') ST.gpBalance = Math.round((ST.gpBalance - pay) * 100) / 100;
      if (fromSym === 'CP') ST.assets.cp = Math.round(((ST.assets.cp || 0) - pay) * 100) / 100;

      /* 累加目标资产（GV 不入账户余额表） */
      if (toSym === 'VC') ST.assets.vc = Math.round(((ST.assets.vc || 0) + get) * 100) / 100;
      if (toSym === 'CNCT') ST.assets.cnct = Math.round(((ST.assets.cnct || 0) + get) * 100) / 100;
      if (toSym === '红包') ST.assets.redpacket = Math.round(((ST.assets.redpacket || 0) + get) * 100) / 100;

      /* 写入账单：GP 支出 + 目标资产收入（复式记账） */
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const orderId = 'EX' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + String(Math.floor(Math.random() * 900) + 100);

      ST.bills = ST.bills || [];
      ST.bills.unshift({
        asset: toSym,
        src: 'exchange',
        type: 'in',
        title: `${fromSym} 兑换 ${toSym}`,
        desc: `${trimNum(pay)} ${fromSym} → ${trimNum(get)} ${toSym}${t.feeRate > 0 ? '（扣 ' + Math.round(t.feeRate * 100) + '% 平台服务费）' : ''}`,
        amount: get,
        time: timeStr,
        balance: toSym === 'GV' ? null : balanceOf(toSym)
      });
      ST.bills.unshift({
        asset: fromSym,
        src: 'exchange',
        type: 'out',
        title: `兑换 ${toSym}`,
        desc: `订单 ${orderId} · 支出 ${trimNum(pay)} ${fromSym}`,
        amount: -pay,
        time: timeStr,
        balance: fromSym === 'GP' ? ST.gpBalance : (ST.assets.cp || 0)
      });

      /* 写入兑换记录 */
      ST.swaps = ST.swaps || [];
      ST.swaps.unshift({
        id: orderId,
        fromSym: fromSym,
        toSym: toSym,
        pay: pay,
        get: get,
        rateText: t.rateText,
        feeText: t.feeRate > 0
          ? trimNum(pay * t.feeRate) + ' ' + fromSym + '（' + Math.round(t.feeRate * 100) + '%）'
          : '0.00（免手续费）',
        time: timeStr
      });

      saveState(ST);

      closeConfirm();
      showResult(orderId, pay, get, t, timeStr);

      document.getElementById('payInput').value = '';
      document.getElementById('getInput').value = '';
      render();
      renderSwapLog();
    }

    /* ================= 第三步：到账凭证 ================= */
    function showResult(orderId, pay, get, t, timeStr) {
      document.getElementById('rsSub').textContent = `${trimNum(pay)} ${fromSym} → ${trimNum(get)} ${t.sym}`;
      document.getElementById('rsCard').innerHTML = `
        <div class="result-row"><span>兑换订单号</span><span class="v">${orderId}</span></div>
        <div class="result-row"><span>兑换汇率</span><span class="v">${t.rateText}</span></div>
        <div class="result-row"><span>平台手续费</span><span class="v">${t.feeRate > 0 ? trimNum(pay * t.feeRate) + ' ' + fromSym : '0.00（免手续费）'}</span></div>
        <div class="result-row"><span>实际到账</span><span class="v">${trimNum(get)} ${t.sym}</span></div>
        <div class="result-row"><span>到账时效</span><span class="v">${t.arrive}</span></div>
        <div class="result-row"><span>完成时间</span><span class="v">${timeStr}</span></div>`;
      document.getElementById('resultModal').classList.add('show');
    }

    function closeResult() {
      document.getElementById('resultModal').classList.remove('show');
    }

    /* ================= 兑换记录（最近 5 条） ================= */
    function renderSwapLog() {
      const box = document.getElementById('swapLog');
      const logs = (ST.swaps || []).slice(0, 5);

      if (!logs.length) {
        box.innerHTML = '<div class="empty">暂无兑换记录</div>';
        return;
      }

      box.innerHTML = logs.map(s => {
        const t = TOKENS[s.toSym] || { iconText: '—', iconBg: 'linear-gradient(135deg,#94a3b8,#64748b)' };
        const from = s.fromSym || 'GP';
        return `
          <div class="log-item" onclick="location.href='兑换详情.html?id=${s.id}'">
            <span class="log-icon" style="background:${t.iconBg}">${t.iconText}</span>
            <div class="log-body">
              <div class="log-title">${from} 兑换 ${s.toSym}</div>
              <div class="log-sub">${trimNum(s.pay)} ${from} → ${trimNum(s.get)} ${s.toSym}</div>
            </div>
            <div class="log-right">
              <div class="log-amt">+${trimNum(s.get)}</div>
              <div class="log-time">${s.time}</div>
            </div>
          </div>`;
      }).join('');
    }

    /* ================= Toast ================= */
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ================= 初始化 ================= */
    renderGetOptions();
    render();
    renderSwapLog();
  </script>
</body>

</html>
