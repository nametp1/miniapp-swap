<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>云界数商 · 兑换详情</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #475569;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --brand: #00b86c;
      --brand-2: #00a05b;
      --brand-soft: #e6f9f0;
      --brand-border: #b3ebd0;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --cyan: #0891b2;
      --cyan-soft: #ecfeff;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --line: #e2e8f0;
      --line-2: #f1f5f9;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px -18px rgba(15, 23, 42, .14);
      --brand-3: #008548;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber-border: #fde68a;
      --purple-border: #ddd6fe;
      --rose-border: #fecdd3;
      --cyan-border: #a5f3fc;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, .08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      font-size: 14px;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 130px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    .icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .i11 { font-size: 11px; }
    .i12 { font-size: 12px; }
    .i14 { font-size: 14px; }
    .i16 { font-size: 16px; }
    .i22 { font-size: 22px; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    /* ================= 页头 ================= */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px 12px;
      background: rgba(245, 247, 250, .92);
      backdrop-filter: blur(12px);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--shadow-xs);
      color: var(--ink-2);
    }

    .page-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    /* ================= 状态主卡 ================= */
    .status-hero {
      position: relative;
      overflow: hidden;
      margin: 0 16px 16px;
      padding: 22px 18px 20px;
      border-radius: 20px;
      color: #fff;
      text-align: center;
      animation: rise .45s ease backwards;
      background: linear-gradient(135deg, #00b86c 0%, #0891b2 100%);
      box-shadow: 0 14px 30px -16px rgba(0, 184, 108, .85);
    }

    .status-hero::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -36px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .13);
    }

    .status-hero::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: -30px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
    }

    .status-hero .sh-amount {
      position: relative;
      margin-top: 10px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-feature-settings: "tnum";
    }

    .status-hero .sh-amount b {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .status-hero .sh-label {
      position: relative;
      margin-top: 5px;
      font-size: 12px;
      opacity: .9;
    }

    .status-hero .sh-title {
      position: relative;
      margin-top: 8px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    /* ================= 进度流程节点 ================= */
    .flow-item {
      display: flex;
      gap: 11px;
    }

    .flow-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .flow-dot {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: var(--line-2);
      border: 1.5px solid var(--line);
    }

    .flow-dot .icon {
      stroke-width: 3;
    }

    .flow-item.is-done .flow-dot {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border-color: transparent;
      box-shadow: 0 0 0 3px var(--brand-soft);
    }

    .flow-line {
      flex: 1;
      width: 2px;
      margin: 4px 0 2px;
      border-radius: 2px;
      background: var(--line);
    }

    .flow-item.is-done .flow-line {
      background: var(--brand-border);
    }

    .flow-item:last-child .flow-line {
      display: none;
    }

    .flow-body {
      flex: 1;
      min-width: 0;
      padding-bottom: 15px;
    }

    .flow-item:last-child .flow-body {
      padding-bottom: 0;
    }

    .flow-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .flow-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .flow-val {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--brand);
      font-feature-settings: "tnum";
      white-space: nowrap;
    }

    .flow-time {
      margin-top: 3px;
      font-size: 10.5px;
      color: var(--muted-2);
      font-feature-settings: "tnum";
    }

    /* ================= 展开收起 ================= */
    .detail-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      margin-top: 12px;
      padding: 9px 0;
      border-radius: 12px;
      background: var(--line-2);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .detail-toggle .icon {
      transition: transform .25s;
      color: var(--muted);
    }

    .detail-toggle.open .icon {
      transform: rotate(180deg);
    }

    .detail-panel {
      display: none;
      margin-top: 10px;
      padding: 2px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .detail-panel.show {
      display: block;
      animation: rise .3s ease backwards;
    }

    /* ================= 区块标题 ================= */
    .block-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 0 16px 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .block-label .lb-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .block-label .lb-left .icon {
      color: var(--brand);
    }

    .block-label .lb-right {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    /* ================= 信息卡 ================= */
    .card {
      margin: 0 16px 16px;
      padding: 16px;
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadow-xs);
      animation: rise .45s ease backwards;
      animation-delay: .06s;
    }

    .info-sep-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-2);
      letter-spacing: .3px;
      margin: 14px 0 2px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }

    .info-sep-title:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--line-2);
      font-size: 12.5px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row > span:first-child {
      flex-shrink: 0;
      color: var(--muted);
    }

    .info-row .v {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-weight: 700;
      color: var(--ink);
      font-feature-settings: "tnum";
      text-align: right;
    }

    .info-row .v.rose { color: var(--rose); }

    .info-row .v.brand { color: var(--brand); }

    .copy-btn {
      flex-shrink: 0;
      padding: 3px 8px;
      border-radius: 7px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 10.5px;
      font-weight: 700;
    }

    .copy-btn:active {
      background: var(--brand-border);
    }

    /* ================= 底部操作栏 ================= */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      display: flex;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      z-index: 30;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 13px;
      border-radius: 13px;
      font-size: 14.5px;
      font-weight: 700;
      transition: transform .15s;
    }

    .btn:active { transform: scale(.985); }

    .btn.ghost {
      background: var(--line-2);
      color: var(--ink-2);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      box-shadow: 0 10px 22px -14px rgba(0, 184, 108, 1);
    }

    /* ================= Toast ================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translate(-50%, 12px);
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, .88);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ================= 空态 ================= */
    .empty {
      padding: 60px 24px;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted-2);
    }
  </style>
</head>

<body>
  <!-- ================= SVG 图标池 ================= -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <defs>
      <symbol id="i-chev-l" viewBox="0 0 24 24">
        <polyline points="15 18 9 12 15 6" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <line x1="8" y1="6" x2="21" y2="6" />
        <line x1="8" y1="12" x2="21" y2="12" />
        <line x1="8" y1="18" x2="21" y2="18" />
        <line x1="3" y1="6" x2="3.01" y2="6" />
        <line x1="3" y1="12" x2="3.01" y2="12" />
        <line x1="3" y1="18" x2="3.01" y2="18" />
      </symbol>
      <symbol id="i-swap-v" viewBox="0 0 24 24">
        <polyline points="17 1 21 5 17 9" />
        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
        <polyline points="7 23 3 19 7 15" />
        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
      </symbol>
      <symbol id="i-chev-d" viewBox="0 0 24 24">
        <polyline points="6 9 12 15 18 9" />
      </symbol>
    </defs>
  </svg>

  <!-- ================= 页头 ================= -->
  <header class="page-header">
    <a class="icon-btn" href="兑换记录.html" title="返回兑换记录">
      <svg class="icon i16"><use href="#i-chev-l" /></svg>
    </a>
    <div class="page-title">兑换详情</div>
    <div class="icon-btn" style="visibility:hidden;"></div>
  </header>

  <!-- ================= 状态主卡 ================= -->
  <section class="status-hero" id="hero"></section>

  <!-- ================= 兑换进度 ================= -->
  <div id="progressWrap">
    <div class="block-label">
      <div class="lb-left">
        <svg class="icon i14"><use href="#i-swap-v" /></svg>
        兑换进度
      </div>
      <div class="lb-right">已完成</div>
    </div>
    <section class="card" id="progressCard"></section>
  </div>

  <!-- ================= 兑换信息 ================= -->
  <div class="block-label">
    <div class="lb-left">
      <svg class="icon i14"><use href="#i-list" /></svg>
      兑换信息
    </div>
    <div class="lb-right" id="statusText"></div>
  </div>
  <section class="card" id="infoCard"></section>

  <!-- ================= 底部操作栏 ================= -->
  <div class="action-bar">
    <a class="btn ghost" href="兑换记录.html">
      <svg class="icon i14"><use href="#i-list" /></svg>
      全部记录
    </a>
    <a class="btn primary" href="资产兑换.html">
      <svg class="icon i16"><use href="#i-swap-v" /></svg>
      再兑一笔
    </a>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const OTC_KEY = 'yjss_otc_state_v2';

    function seedState() {
      return {
        gpBalance: 128.00,
        frozenGp: 100.00,
        market: [],
        myOrders: [],
        deals: [],
        records: [],
        assets: { cp: 5000, vc: 0, cnct: 8.60, redpacket: 10.00 },
        swaps: [
          { id: 'EX202609130101', fromSym: 'GP', toSym: 'VC', pay: 20, get: 20, rateText: '1 GP = 1.00 VC', feeText: '0.00（免手续费）', time: '2026-09-13 09:24' },
          { id: 'EX202609122108', fromSym: 'GP', toSym: 'CNCT', pay: 10, get: 9, rateText: '1 GP = 0.90 CNCT', feeText: '1.00 GP（10%）', time: '2026-09-12 21:08' },
          { id: 'EX202609091540', fromSym: 'GP', toSym: 'GV', pay: 10, get: 0.82, rateText: '1 GP = 0.0820 GV', feeText: '0.00（免手续费）', time: '2026-09-09 15:40' }
        ]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(OTC_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (s && typeof s.gpBalance === 'number') {
            s.swaps = (s.swaps && s.swaps.length) ? s.swaps : seedState().swaps;
            return s;
          }
        }
      } catch (e) { /* 忽略 */ }
      const s = seedState();
      try { localStorage.setItem(OTC_KEY, JSON.stringify(s)); } catch (e) { /* 忽略 */ }
      return s;
    }

    const ST = loadState();

    const TOKENS = {
      VC: { sym: 'VC', full: 'VC 代金券', iconText: 'VC', iconBg: 'linear-gradient(135deg,#3b82f6,#06b6d4)', arrive: '即时到账' },
      CNCT: { sym: 'CNCT', full: 'CNCT 数权宝积分', iconText: 'CN', iconBg: 'linear-gradient(135deg,#8b5cf6,#d946ef)', arrive: '跨生态接口到账' },
      GV: { sym: 'GV', full: 'GV 数字通证', iconText: 'GV', iconBg: 'linear-gradient(135deg,#f59e0b,#f97316)', arrive: '按实时汇率折算' },
      红包: { sym: '红包', full: '红包', iconText: '红包', iconBg: 'linear-gradient(135deg,#f43f5e,#e11d48)', arrive: '即时到账' }
    };

    const FROM_TOKENS = {
      GP: { sym: 'GP', full: 'GP 绿色消费券' },
      CP: { sym: 'CP', full: 'CP 共献积分' }
    };

    const trimNum = n => (isFinite(n) ? String(parseFloat(Number(n).toFixed(6))) : '');

    /* ================= 取记录 ================= */
    const QS = new URLSearchParams(location.search);
    const QID = QS.get('id');
    const list = ST.swaps || [];
    const rec = list.find(s => s.id === QID) || list[0];

    let ORDER_ID = '';
    let detailOpen = false;

    /* ================= 展开收起 ================= */
    function toggleDetail() {
      detailOpen = !detailOpen;
      document.getElementById('detailPanel').classList.toggle('show', detailOpen);
      document.getElementById('detailToggle').classList.toggle('open', detailOpen);
    }

    function render() {
      const hero = document.getElementById('hero');
      const progressWrap = document.getElementById('progressWrap');
      const progressCard = document.getElementById('progressCard');
      const infoCard = document.getElementById('infoCard');

      if (!rec) {
        hero.innerHTML = '<div class="sh-title">未找到该笔兑换</div>';
        progressWrap.style.display = 'none';
        infoCard.innerHTML = `
          <div class="empty">
            未找到该笔兑换<br>
            <a href="兑换记录.html" style="color:var(--brand);font-weight:700;">返回兑换记录</a>
          </div>`;
        return;
      }

      const from = FROM_TOKENS[rec.fromSym] || FROM_TOKENS.GP;
      const t = TOKENS[rec.toSym] || { sym: rec.toSym, full: rec.toSym, arrive: '即时到账' };
      const pay = trimNum(rec.pay);
      const got = trimNum(rec.get);
      ORDER_ID = rec.id;

      document.getElementById('statusText').textContent = '已完成';

      /* 状态主卡 */
      hero.innerHTML = `
        <div class="sh-amount"><b>${pay} ${from.sym}</b></div>
        <div class="sh-label">兑换为 ${got} ${t.sym}</div>
        <div class="sh-title">兑换成功</div>`;

      const feeM = rec.feeText.match(/^([\d.]+)\s*([A-Za-z]*)/);
      const feeNum = feeM ? feeM[1] : '0';
      const feeUnit = (feeM && feeM[2]) ? feeM[2] : (rec.fromSym === 'GP' ? 'GP' : '');
      const ptm = (rec.time.split(' ')[1]) || '—';

      /* 兑换进度 */
      const flowSteps = [
        { label: '发起兑换', val: `${pay} ${from.sym}` },
        { label: '支付确认', val: `${feeNum} ${feeUnit}`.trim() },
        { label: '资产到账', val: `${got} ${t.sym}` }
      ];

      progressCard.innerHTML = flowSteps.map(s => `
        <div class="flow-item is-done">
          <div class="flow-rail">
            <span class="flow-dot"><svg class="icon i11"><use href="#i-check" /></svg></span>
            <span class="flow-line"></span>
          </div>
          <div class="flow-body">
            <div class="flow-top">
              <span class="flow-name">${s.label}</span>
              <span class="flow-val">${s.val}</span>
            </div>
            <div class="flow-time">${ptm}</div>
          </div>
        </div>`).join('');

      /* 兑换信息 */
      infoCard.innerHTML = `
        <div class="info-sep-title">到账信息</div>
        <div class="info-row">
          <span>实际到账</span>
          <span class="v brand">+${got} ${t.sym}</span>
        </div>
        <div class="info-row">
          <span>到账资产</span>
          <span class="v">${t.full}</span>
        </div>
        <div class="info-row">
          <span>到账时效</span>
          <span class="v">${t.arrive}</span>
        </div>

        <button class="detail-toggle${detailOpen ? ' open' : ''}" id="detailToggle" onclick="toggleDetail()">
          订单与金额明细
          <svg class="icon i14"><use href="#i-chev-d" /></svg>
        </button>

        <div class="detail-panel${detailOpen ? ' show' : ''}" id="detailPanel">
          <div class="info-sep-title">订单信息</div>
          <div class="info-row">
            <span>兑换订单号</span>
            <span class="v">${rec.id}<button class="copy-btn" onclick="copyId()">复制</button></span>
          </div>
          <div class="info-row">
            <span>兑换通道</span>
            <span class="v">${from.sym} → ${t.sym}</span>
          </div>
          <div class="info-row">
            <span>完成时间</span>
            <span class="v">${rec.time}</span>
          </div>

          <div class="info-sep-title">金额明细</div>
          <div class="info-row">
            <span>支付数量</span>
            <span class="v rose">-${pay} ${from.sym}</span>
          </div>
          <div class="info-row">
            <span>兑换汇率</span>
            <span class="v">${rec.rateText || ''}</span>
          </div>
          <div class="info-row">
            <span>平台手续费</span>
            <span class="v">${rec.feeText || '0.00（免手续费）'}</span>
          </div>
        </div>`;
    }

    /* ================= 复制订单号 ================= */
    function copyId() {
      const done = () => showToast('订单号已复制');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ORDER_ID).then(done).catch(() => fallbackCopy(ORDER_ID, done));
      } else {
        fallbackCopy(ORDER_ID, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { /* 忽略 */ }
      document.body.removeChild(ta);
      done();
    }

    /* ================= Toast ================= */
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    render();
  </script>
</body>

</html>
