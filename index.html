<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>云界数商 · 应用授权</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #475569;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --brand: #00b86c;
      --brand-2: #00a05b;
      --brand-soft: #e6f9f0;
      --brand-border: #b3ebd0;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --purple-border: #ddd6fe;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --rose-border: #fecdd3;
      --cyan: #0891b2;
      --cyan-soft: #ecfeff;
      --cyan-border: #a5f3fc;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;
      --line: #e2e8f0;
      --line-2: #f1f5f9;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px -18px rgba(15, 23, 42, .14);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, .08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      font-size: 14px;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 100px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    .icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .i11 { font-size: 11px; }
    .i12 { font-size: 12px; }
    .i14 { font-size: 14px; }
    .i16 { font-size: 16px; }
    .i18 { font-size: 18px; }
    .i20 { font-size: 20px; }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ================= 授权主卡 ================= */
    .auth-hero {
      position: relative;
      overflow: hidden;
      margin: 12px 16px 16px;
      padding: 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00b86c 0%, #0891b2 100%);
      color: #fff;
      box-shadow: 0 14px 30px -16px rgba(0, 184, 108, .9);
      animation: rise .45s ease backwards;
    }

    .auth-hero::before {
      content: '';
      position: absolute;
      top: -56px;
      right: -34px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .13);
    }

    .auth-hero::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: -36px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .09);
    }

    .ah-top {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ah-logo {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .22);
      border: 1px solid rgba(255, 255, 255, .3);
    }

    .ah-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .ah-from {
      margin-top: 4px;
      font-size: 11px;
      opacity: .9;
      font-feature-settings: "tnum";
    }

    .ah-state {
      margin-left: auto;
      flex-shrink: 0;
      padding: 5px 11px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .26);
      font-size: 10.5px;
      font-weight: 700;
    }

    .ah-desc {
      position: relative;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, .22);
      font-size: 11.5px;
      line-height: 1.6;
      opacity: .94;
    }

    /* ================= 通用块 ================= */
    .block-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 0 16px 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .block-label .lb-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .block-label .lb-left .icon {
      color: var(--brand);
    }

    .card {
      margin: 0 16px 16px;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-xs);
      animation: rise .45s ease backwards;
      animation-delay: .05s;
    }

    /* ================= 信息行 ================= */
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      font-size: 12.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--line-2);
    }

    .info-row:first-child {
      padding-top: 0;
    }

    .info-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .info-row .v {
      font-weight: 700;
      color: var(--ink);
      font-feature-settings: "tnum";
      text-align: right;
    }

    .info-row .v.brand {
      color: var(--brand);
    }

    /* ================= 授权说明 ================= */
    .note-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 11px 0;
      border-bottom: 1px dashed var(--line-2);
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--ink-3);
    }

    .note-row:first-child {
      padding-top: 0;
    }

    .note-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .note-row .icon {
      color: var(--brand);
      margin-top: 2px;
      flex-shrink: 0;
    }

    /* ================= 底部操作 ================= */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      display: flex;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .97);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--line);
      z-index: 100;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      transition: transform .15s;
    }

    .btn:active {
      transform: scale(.985);
    }

    .btn.ghost {
      flex: 1;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--ink-3);
    }

    .btn.primary {
      flex: 1.7;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      box-shadow: 0 10px 22px -12px rgba(0, 184, 108, .9);
    }

    /* ================= Toast ================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translate(-50%, 14px);
      max-width: 300px;
      padding: 11px 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, .92);
      color: #fff;
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>

<body>

  <!-- ================= SVG 图标池 ================= -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <symbol id="i-swap-v" viewBox="0 0 24 24">
        <polyline points="8 4 12 8 16 4" />
        <line x1="12" y1="8" x2="12" y2="16" />
        <polyline points="16 20 12 16 8 20" />
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21v-1c0-3.3 3.6-6 8-6s8 2.7 8 6v1" />
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12" />
      </symbol>
    </defs>
  </svg>

  <!-- ================= 授权主卡 ================= -->
  <section class="auth-hero">
    <div class="ah-top">
      <span class="ah-logo"><svg class="icon i20"><use href="#i-swap-v" /></svg></span>
      <div style="min-width:0;">
        <div class="ah-name">SWAP 数字资产</div>
        <div class="ah-from" id="fromLine">来自 云界数商商城</div>
      </div>
      <span class="ah-state" id="authState">待授权</span>
    </div>
    <div class="ah-desc" id="authDesc">请求使用你的账号信息与资产数据</div>
  </section>

  <!-- ================= 用户信息 ================= -->
  <div class="block-label">
    <div class="lb-left">
      <svg class="icon i14"><use href="#i-user" /></svg>
      用户信息
    </div>
  </div>
  <section class="card">
    <div class="info-row">
      <span>UID</span>
      <span class="v">8826 5130</span>
    </div>
    <div class="info-row">
      <span>身份</span>
      <span class="v">创客</span>
    </div>
    <div class="info-row">
      <span>账号状态</span>
      <span class="v brand">正常</span>
    </div>
  </section>

  <!-- ================= 授权说明 ================= -->
  <div class="block-label">
    <div class="lb-left">
      <svg class="icon i14"><use href="#i-shield" /></svg>
      授权说明
    </div>
  </div>
  <section class="card">
    <div class="note-row">
      <svg class="icon i14"><use href="#i-check" /></svg>
      <span>授权范围：账号信息与资产信息（CP、GP、VC、红包、CNCT）</span>
    </div>
    <div class="note-row">
      <svg class="icon i14"><use href="#i-check" /></svg>
      <span>授权数据仅用于 SWAP 内的资产查看与流转</span>
    </div>
    <div class="note-row">
      <svg class="icon i14"><use href="#i-check" /></svg>
      <span>不会获取你的支付密码与钱包私钥</span>
    </div>
  </section>

  <!-- ================= 底部操作 ================= -->
  <div class="action-bar">
    <button class="btn ghost" onclick="refuse()">拒绝</button>
    <button class="btn primary" id="grantBtn" onclick="grant()">
      <svg class="icon i16"><use href="#i-shield" /></svg>
      <span id="grantText">同意并授权</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ============================================================
       授权页：商城 → SWAP 的前置步骤
       授权结果写入 yjss_swap_auth_v1，授权后进入 SWAP（支持 ?next=）
       ============================================================ */
    const AUTH_KEY = 'yjss_swap_auth_v1';
    const MALL_BACK = '../商城/我的-个人中心.html';

    /* ================= 授权记录 ================= */
    function loadAuth() {
      try {
        const raw = localStorage.getItem(AUTH_KEY);
        if (raw) return JSON.parse(raw) || {};
      } catch (e) { /* 忽略 */ }
      return {};
    }

    function saveAuth(rec) {
      try { localStorage.setItem(AUTH_KEY, JSON.stringify(rec)); } catch (e) { /* 忽略 */ }
    }

    let auth = loadAuth();

    /* ================= 授权目标页（仅允许 SWAP 内相对路径） ================= */
    function nextPage() {
      let p = '';
      try { p = new URLSearchParams(location.search).get('next') || ''; } catch (e) { /* 忽略 */ }
      if (!p || /^[a-z]+:/i.test(p) || p.startsWith('//') || p.indexOf('..') >= 0) return '资产页面.html';
      return p;
    }

    /* ================= 操作 ================= */
    function nowStr() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function grant() {
      auth = { authorized: true, time: nowStr(), scope: ['profile', 'assets'] };
      saveAuth(auth);
      showToast('授权成功，正在进入 SWAP 数字资产');
      setTimeout(() => { location.href = nextPage(); }, 650);
    }

    function refuse() {
      showToast('已取消授权');
      setTimeout(() => { location.href = MALL_BACK; }, 500);
    }

    /* ================= Toast ================= */
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

  </script>
</body>

</html>
